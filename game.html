function renderRosters() {
  const trumpPanel = document.getElementById('roster-trump');
  const irgcPanel = document.getElementById('roster-irgc');
  
  trumpPanel.innerHTML = '';
  irgcPanel.innerHTML = '';

  TRUMP_CARDS.forEach(card => {
    const el = createMiniCard(card, 'trump');
    trumpPanel.appendChild(el);
  });

  IRGC_CARDS.forEach(card => {
    const el = createMiniCard(card, 'irgc');
    irgcPanel.appendChild(el);
  });
}

function createMiniCard(card, side) {
  const el = document.createElement('div');
  el.className = `mini-card ${side}`;
  el.dataset.cardId = card.id;

  const cooldown = game.cooldowns[side][card.id] || 0;
  const available = game.isCardAvailable(card, side);
  const isPlayerSide = side === game.playerSide;
  const canPlay = isPlayerSide && available && game.phase === 'select';

  if (!available || cooldown > 0) el.classList.add('disabled');
  if (canPlay) el.classList.add('playable');

  // Format effect with sign
  const fmt = (v) => v > 0 ? `+${v}` : `${v}`;
  const cls = (v) => v > 0 ? 'positive' : (v < 0 ? 'negative' : 'zero');
  
  // Build tooltip HTML showing full card preview with effects
  const e = card.effects;
  // Tooltip positioning handled by CSS based on #game.lang-fa
  const tooltipHtml = `
    <div class="card-tooltip">
      <div class="tooltip-header">${t(card.name)}</div>
      <div class="tooltip-art">[CARD ART]</div>
      <div class="tooltip-desc">${t(card.desc) || ''}</div>
      <div class="tooltip-effects">
        <div class="effect-col trump">
          <div class="effect-col-label">${t(UI.trumpName)}</div>
          <div class="effect-item ${cls(e.lev)}">${t(UI.levAbbr)} ${fmt(e.lev)}</div>
          <div class="effect-item ${cls(e.pol)}">${t(UI.polAbbr)} ${fmt(e.pol)}</div>
          <div class="effect-item ${cls(e.all)}">${t(UI.allAbbr)} ${fmt(e.all)}</div>
        </div>
        <div class="effect-col irgc">
          <div class="effect-col-label">${t(UI.irgcName)}</div>
          <div class="effect-item ${cls(e.grip)}">${t(UI.gripAbbr)} ${fmt(e.grip)}</div>
          <div class="effect-item ${cls(e.chest)}">${t(UI.chestAbbr)} ${fmt(e.chest)}</div>
          <div class="effect-item ${cls(e.proxy)}">${t(UI.proxyAbbr)} ${fmt(e.proxy)}</div>
        </div>
      </div>
    </div>
  `;

  el.innerHTML = t(card.name) + (cooldown > 0 ? ` <span class="cooldown">(${cooldown}${t(UI.cooldownDays)})</span>` : '') + tooltipHtml;

  if (canPlay) {
    el.addEventListener('click', () => selectCard(card));
  }

  return el;
}

function selectCard(card) {
  if (game.phase !== 'select') return; // Prevent multiple plays
  audioManager.playSFX('cardSelect');
  game.selectedCard = card;

function showConsequences(trumpCard, irgcCard) {
  const contentEl = document.getElementById('consequences-content');
  
  // Bar display names (localized)
  const barNames = {
    lev: t(UI.levAbbr), pol: t(UI.polAbbr), all: t(UI.allAbbr),
    grip: t(UI.gripAbbr), chest: t(UI.chestAbbr), proxy: t(UI.proxyAbbr)
  };
  
  // Check for blocked cards (e.g., SELL OIL blocked by BLOCKADE)
  const irgcBlocked = irgcCard.blockedBy && game.flags[irgcCard.blockedBy];
  const trumpBlocked = trumpCard.blockedBy && game.flags[trumpCard.blockedBy];
  
  // Sum effects from both cards for all 6 bars, accounting for blockades
  const totals = { lev: 0, pol: 0, all: 0, grip: 0, chest: 0, proxy: 0 };
  const blocked = { chest: false };
  
  for (const bar in totals) {
    let trumpEffect = trumpCard.effects[bar];
    let irgcEffect = irgcCard.effects[bar];
    
    // Neutralize blocked chest gains
    if (bar === 'chest') {
      if (irgcBlocked && irgcEffect > 0) {
        blocked.chest = true;
        irgcEffect = 0;
      }
      if (trumpBlocked && trumpEffect > 0) {
        blocked.chest = true;
        trumpEffect = 0;
      }
    }
    
    totals[bar] = trumpEffect + irgcEffect;
  }
  
  // Calculate ongoing flag effects (will be applied next turn)
  const flagTotals = { lev: 0, pol: 0, all: 0, grip: 0, chest: 0, proxy: 0 };
  const internetUp = game.flags.STARLINK || !game.flags.INTERNET_SHUTDOWN;
  
  for (const flagKey in FLAG_DATA) {
    if (!game.flags[flagKey]) continue;
    const flagData = FLAG_DATA[flagKey];
    if (!flagData.perTurn) continue;
    
    for (const bar in flagData.perTurn) {
      let effect = flagData.perTurn[bar];
      // Internet shutdown halves negative grip effects from protests
      if (bar === 'grip' && effect < 0 && !internetUp && 
          (flagKey === 'PROTESTS' || flagKey === 'BASIJ_DEFECT')) {
        effect = Math.ceil(effect / 2);
      }
      flagTotals[bar] += effect;
    }
  }
  
  // Split into Trump bars (lev, pol, all) and IRGC bars (grip, chest, proxy)
  const trumpEffects = ['lev', 'pol', 'all']
    .filter(bar => totals[bar] !== 0)
    .map(bar => ({ bar: barNames[bar], val: totals[bar] }));
  const irgcEffects = ['grip', 'chest', 'proxy']
    .filter(bar => totals[bar] !== 0 || (bar === 'chest' && blocked.chest))
    .map(bar => ({ bar: barNames[bar], val: totals[bar], blocked: bar === 'chest' && blocked.chest }));

  // Flag effects for display
  const trumpFlagEffects = ['lev', 'pol', 'all']
    .filter(bar => flagTotals[bar] !== 0)
    .map(bar => ({ bar: barNames[bar], val: flagTotals[bar] }));
  const irgcFlagEffects = ['grip', 'chest', 'proxy']
    .filter(bar => flagTotals[bar] !== 0)
    .map(bar => ({ bar: barNames[bar], val: flagTotals[bar] }));

  let html = '<div class="column trump"><div class="column-label">TRUMP</div>';
  trumpEffects.forEach(e => {
    html += `<div class="effect ${e.val > 0 ? 'positive' : 'negative'}">${e.bar} ${e.val > 0 ? '+' : ''}${e.val}</div>`;
  });
  if (trumpEffects.length === 0) html += '<div class="effect">—</div>';
  html += '</div>';
  
  html += '<div class="column irgc"><div class="column-label">IRGC</div>';
  irgcEffects.forEach(e => {
    if (e.blocked && e.val === 0) {
      html += `<div class="effect blocked">${e.bar} BLOCKED</div>`;
    } else {
      html += `<div class="effect ${e.val > 0 ? 'positive' : 'negative'}">${e.bar} ${e.val > 0 ? '+' : ''}${e.val}</div>`;
    }
  });
  if (irgcEffects.length === 0) html += '<div class="effect">—</div>';
  html += '</div>';
  
  // Add ongoing flag effects section if any are active
  if (trumpFlagEffects.length > 0 || irgcFlagEffects.length > 0) {
    html += '<div class="flag-effects-row">';
    html += '<div class="flag-effects-label">ONGOING</div>';
    html += '<div class="flag-effects-cols">';
    
    html += '<div class="column trump">';
    trumpFlagEffects.forEach(e => {
      html += `<div class="effect flag-effect ${e.val > 0 ? 'positive' : 'negative'}">${e.bar} ${e.val > 0 ? '+' : ''}${e.val}/turn</div>`;
    });
    if (trumpFlagEffects.length === 0) html += '<div class="effect flag-effect">—</div>';
    html += '</div>';
    
    html += '<div class="column irgc">';
    irgcFlagEffects.forEach(e => {
      html += `<div class="effect flag-effect ${e.val > 0 ? 'positive' : 'negative'}">${e.bar} ${e.val > 0 ? '+' : ''}${e.val}/turn</div>`;
    });
    if (irgcFlagEffects.length === 0) html += '<div class="effect flag-effect">—</div>';
    html += '</div>';
    
    html += '</div></div>';
  }
  
  contentEl.innerHTML = html;
  document.getElementById('consequences').classList.add('show');
}

function updateSelectInstruction(show) {
  const trumpInstr = document.getElementById('instr-trump');
  const irgcInstr = document.getElementById('instr-irgc');
  
  // Set labels based on which side is player vs opponent
  if (game.playerSide === 'trump') {
    trumpInstr.textContent = t(UI.selectCard);
    irgcInstr.textContent = t(UI.enemyOptions);
  } else {
    irgcInstr.textContent = t(UI.selectCard);
    trumpInstr.textContent = t(UI.enemyOptions);
  }
  
  if (show && game.playerSide === 'trump') {
    trumpInstr.classList.add('active', 'blink-cursor');
    irgcInstr.classList.remove('active', 'blink-cursor');
  } else if (show && game.playerSide === 'irgc') {
    irgcInstr.classList.add('active', 'blink-cursor');
    trumpInstr.classList.remove('active', 'blink-cursor');
  } else {
    trumpInstr.classList.remove('active', 'blink-cursor');
    irgcInstr.classList.remove('active', 'blink-cursor');
  }

function setPhase(phase) {
  game.phase = phase;
  const indicator = document.getElementById('phase-indicator');
  const btn = document.getElementById('btn-action');
  const gameScreen = document.getElementById('screen-game');
  
  // Enable tooltips only during select phase
  gameScreen.classList.toggle('tooltips-enabled', phase === 'select');
  
  switch (phase) {
    case 'select':
      indicator.textContent = '';
      btn.style.display = 'none';
      // Show instruction on player's side
      updateSelectInstruction(true);
      break;
    case 'waiting':
      indicator.textContent = '';
      btn.style.display = 'none';
      updateSelectInstruction(false);
      break;
    case 'consequences':
      indicator.textContent = t(UI.resolution);
      btn.style.display = 'none';
      break;
    case 'wildcard':
      indicator.textContent = '';
      btn.style.display = 'none';
      break;
  }
}

function updateDateDisplay(useTypewriter = false) {
  const dateStr = getGameDate(game.day);
  document.getElementById('board-day').textContent = `${t(UI.day)} ${game.day}`;
  document.getElementById('board-date').textContent = dateStr;
  
  const storyText = getStoryUpdate(game.day);
  if (useTypewriter) {
    updateStoryWithTypewriter(storyText);
  } else {
    document.getElementById('board-story-text').textContent = storyText;
  }
}

function startGame() {
  showScreen('screen-game', true);
  // Clear any leftover night-fade from previous game
  document.querySelector('.board').classList.remove('night-fade');
  updateDateDisplay(true);
  updateBars();
  renderFlags();
  updateFlags();
  renderRosters();
  clearRevealSlots();
  hideConsequences();
  hideWildcard();
  hideCharacterQuotes();
  game.selectedCard = null;
  setPhase('select');
}

function commitCard() {
  game.aiCard = pickAICard();
  
  // Store cards for this round
  game.trumpCard = game.playerSide === 'trump' ? game.selectedCard : game.aiCard;
  game.irgcCard = game.playerSide === 'irgc' ? game.selectedCard : game.aiCard;

  // Check for wildcard now
  game.currentWildcard = Math.random() < 1.0 
    ? WILDCARDS[Math.floor(Math.random() * WILDCARDS.length)] 
    : null;

  // Show reveal area and prepare slots
  showRevealArea();
  const slotTrump = document.getElementById('slot-trump');
  const slotIrgc = document.getElementById('slot-irgc');
  
  // Reset slot classes and add slide-in
  slotTrump.className = 'reveal-slot trump slide-in';
  slotIrgc.className = 'reveal-slot irgc slide-in';
  
  // Add card backs
  slotTrump.innerHTML = '<div class="card-back trump"></div>';
  slotIrgc.innerHTML = '<div class="card-back irgc"></div>';

  setPhase('waiting');
  renderRosters(); // Disable all cards

  // After pause, flip both cards simultaneously
  setTimeout(() => {
    flipAndReveal();
  }, 600);
}

function flipAndReveal() {
  const slotTrump = document.getElementById('slot-trump');
  const slotIrgc = document.getElementById('slot-irgc');
  
  // Remove slide-in class
  slotTrump.classList.remove('slide-in');
  slotIrgc.classList.remove('slide-in');
  
  // Play card flip sound
  audioManager.playSFX('cardFlip');
  
  // Create flipping cards
  const trumpCard = createBigCard(game.trumpCard, 'trump');
  const irgcCard = createBigCard(game.irgcCard, 'irgc');
  trumpCard.classList.add('flip');
  irgcCard.classList.add('flip');
  
  // Replace card backs with actual cards
  slotTrump.innerHTML = '';
  slotIrgc.innerHTML = '';
  slotTrump.appendChild(trumpCard);
  slotIrgc.appendChild(irgcCard);
  
  // Show both quotes simultaneously
  showCharacterQuote('trump', game.trumpCard);
  showCharacterQuote('irgc', game.irgcCard);

  // Show consequences first, apply effects when user clicks Continue
  setTimeout(() => {
    showConsequences(game.trumpCard, game.irgcCard);
    setPhase('consequences');
  }, 1000);
}

  const quoteEl = document.getElementById(`quote-${side}`);
  quoteEl.textContent = `"${t(card.voice)}"`;
  quoteEl.classList.add('active');

}


function showWildcardPhase() {
  hideConsequences();
  
  if (game.currentWildcard) {
    const slotTrump = document.getElementById('slot-trump');
    const slotIrgc = document.getElementById('slot-irgc');
    
    // Slide cards out to the sides
    slotTrump.classList.add('slide-out');
    slotIrgc.classList.add('slide-out');
    
    // After slide out animation, show wildcard (but don't apply effects yet)
    setTimeout(() => {
      slotTrump.innerHTML = '';
      slotIrgc.innerHTML = '';
      
      // Play wildcard sound
      audioManager.playSFX('wildcard');
      
      showWildcard(game.currentWildcard);
      setPhase('wildcard');
    }, 450);
  } else {
    clearRevealSlots();
    nextDay();
  }
}

function nextDay() {
  // Check for win before advancing
  const endKey = game.checkWin();
  if (endKey) {
    showEnding(endKey);
    return;
  }

  const board = document.querySelector('.board');
  
  // Fade board content to black
  board.classList.add('night-fade');
  
  // After fade completes, make changes and fade back
  setTimeout(() => {
    // Clear UI
    hideConsequences();
    hideWildcard();
    hideCharacterQuotes();
    clearRevealSlots();

    // Advance game state
    game.decrementCooldowns();
    const previousDay = game.day;
    game.day++;
    game.selectedCard = null;
    game.aiCard = null;
    game.trumpCard = null;
    game.irgcCard = null;
    game.currentWildcard = null;

    // Apply per-turn flag effects
    game.applyFlagEffects();
    updateBars();
    updateFlags();
    
    // Check for win after flag effects
    const flagEndKey = game.checkWin();
    if (flagEndKey) {
      showEnding(flagEndKey);
      return;
    }

    // Check for story interlude (after days 3, 6, 9, 12)
    if (INTERLUDE_STORIES[previousDay]) {
      startInterlude(previousDay, () => {
        showScreen('screen-game', true);
        finishNextDay(board);
      });
      return;
    }

    finishNextDay(board);
  }, 600); // Wait for fade to black
}

function finishNextDay(board) {
  // Update display with typewriter effect
  updateDateDisplay(true);
  setPhase('select');
  renderRosters();
  
  // Fade back up
  setTimeout(() => {
    board.classList.remove('night-fade');
  }, 100);
}

function showEnding(key) {
  const ending = ENDINGS[key];
  
  // Play victory or defeat sound based on player outcome
  const playerWon = ending.winner === game.playerSide;
  const isStalemate = ending.winner !== 'trump' && ending.winner !== 'irgc';
  if (isStalemate) {
    audioManager.playSFX('defeat');
  } else if (playerWon) {
    audioManager.playSFX('victory');
  } else {
    audioManager.playSFX('defeat');
  }
  audioManager.applyMusicState('victory');
  
  // Set winner announcement using UI strings
  const winnerEl = document.getElementById('ending-winner');
  winnerEl.className = 'ending-winner';
  if (ending.winner === 'trump') {
    winnerEl.textContent = t(UI.trumpWins);
    winnerEl.classList.add('trump-win', 'glow-green');
  } else if (ending.winner === 'irgc') {
    winnerEl.textContent = t(UI.irgcWins);
    winnerEl.classList.add('irgc-win', 'glow-red');
  } else {
    winnerEl.textContent = t(UI.stalemateLabel);
    winnerEl.classList.add('stalemate', 'glow-gold');
  }
  
  // Set title using t() for bilingual ending title
  const titleEl = document.getElementById('ending-title');
  titleEl.textContent = t(ending.title);
  titleEl.className = 'ending-title';
  if (ending.winner === 'trump') {
    titleEl.classList.add('trump-win', 'glow-green');
  } else if (ending.winner === 'irgc') {
    titleEl.classList.add('irgc-win', 'glow-red');
  } else {
    titleEl.classList.add('stalemate', 'glow-gold');
  }

  document.getElementById('ending-stats').textContent = 
    `${getGameDate(game.day)} — ${t(UI.day)} ${game.day}`;

  showScreen('screen-ending', true);
  
  // Display ending description using t() for bilingual
  setTimeout(() => {
    document.getElementById('ending-desc').textContent = t(ending.desc);
  }, 500);
}

function handleAction() {
  switch (game.phase) {
    case 'consequences':
      // Check for wildcard, or go to next day
      showWildcardPhase();
      break;
    case 'wildcard':
      // Wildcard done, next day
      nextDay();
      break;
  }
}

document.getElementById('volume-sfx').addEventListener('input', async (e) => {
  if (!audioManager.initialized) await audioManager.init();
  audioManager.setSFXVolume(e.target.value / 100);
});

// Language toggle
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const lang = btn.dataset.lang;
    setLanguage(lang);
    audioManager.playSFX('click');
    // Update button active states
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

document.getElementById('btn-start').addEventListener('click', async () => {
  // Initialize audio on first user gesture
  if (!audioManager.initialized) await audioManager.init();
  audioManager.playSFX('click');
  audioManager.applyMusicState('pause');
  
  startIntroStory(() => {
    showScreen('screen-select', true);
    audioManager.applyMusicState('menu');
  });
});

document.getElementById('btn-story-next').addEventListener('click', () => {
  audioManager.playSFX('storyAdvance');
  advanceStory();
});
document.getElementById('btn-story-next-cinematic').addEventListener('click', () => {
  audioManager.playSFX('storyAdvance');
  advanceStory();
});

// Skip button for cinematic story mode
document.getElementById('story-skip').addEventListener('click', () => {
  audioManager.playSFX('click');
  // Jump to end of story - call afterCallback directly
  if (storyState.afterCallback) {
    storyState.afterCallback();
  }
});

document.querySelectorAll('.select-card').forEach(card => {
  card.addEventListener('mouseenter', () => {
    audioManager.playSFX('hover');
  });
  card.addEventListener('click', () => {
    audioManager.playSFX('cardSelect');
    audioManager.applyMusicState('explore');
    game.reset();
    game.playerSide = card.dataset.side;
    startGame();
  });
});

document.getElementById('btn-action').addEventListener('click', () => {
  audioManager.playSFX('click');
  handleAction();
});

document.getElementById('btn-continue').addEventListener('click', () => {
  audioManager.playSFX('click');
  if (game.phase === 'consequences') {
    // Hide character quotes when moving past consequences
    hideCharacterQuotes();
    
    // Apply card effects NOW when user clicks Continue
    game.applyCard(game.trumpCard, 'trump');
    game.applyCard(game.irgcCard, 'irgc');
    updateBars();
    updateFlags();
    
    // Check for win BEFORE showing wildcard
    const endKey = game.checkWin();
    if (endKey) {
      hideConsequences();
      clearRevealSlots();
      // Delay so player can see the bar hit 0
      setTimeout(() => {
        showEnding(endKey);
      }, 1000);
    } else {
      showWildcardPhase();
    }
  }
});

document.getElementById('btn-next-day').addEventListener('click', () => {
  audioManager.playSFX('click');
  if (game.phase === 'wildcard') {
    // Apply wildcard effects NOW when user clicks Next Day
    if (game.currentWildcard) {
      game.currentWildcard.apply(game);
      // Clamp all bars to 0-100 after wildcard
      for (const bar of ['lev', 'pol', 'all']) {
        game.bars.trump[bar] = Math.max(0, Math.min(100, game.bars.trump[bar]));
      }
      for (const bar of ['grip', 'chest', 'proxy']) {
        game.bars.irgc[bar] = Math.max(0, Math.min(100, game.bars.irgc[bar]));
      }
      updateBars();
      updateFlags();
      
      // Check for win AFTER wildcard effects
      const endKey = game.checkWin();
      if (endKey) {
        hideWildcard();
        clearRevealSlots();
        // Delay so player can see the bar hit 0
        setTimeout(() => {
          showEnding(endKey);
        }, 1000);
        return;
      }
    }
    nextDay();
  }
});

document.getElementById('btn-restart').addEventListener('click', () => {
  audioManager.playSFX('click');
  audioManager.applyMusicState('menu');
  game.reset();
  showScreen('screen-select', true);
});
</script>

</body>
</html>
