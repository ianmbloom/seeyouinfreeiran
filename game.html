<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crouching Lion — Strategy Game of the Iranian Revolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Vazirmatn:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════════════════
   SECTION 1: CSS STYLES
   - All visual styling for the game
   - No content strings should be in this section
   ════════════════════════════════════════════════════════════════════════════ */

:root {
  --bg: #06080c;
  --grn: #52ff8f;
  --g2: #1ecc5e;
  --gold: #ffd24a;
  --red: #ff5a67;
  --r2: #c0222e;
  --txt: #fafff7;
  --dim: rgba(180,255,210,.65);
  --bdr: rgba(82,255,143,.22);
  --px: 'Press Start 2P', monospace;
  --vt: 'VT323', monospace;
  --fa: 'Vazirmatn', 'Tahoma', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100vw; height: 100vh; overflow: hidden;
  background: var(--bg); color: var(--txt);
  font-family: var(--vt);
  user-select: none; -webkit-user-select: none;
}

/* ═══════════════════════════════════════════════════════════════════
   RETRO CRT EFFECTS
   ═══════════════════════════════════════════════════════════════════ */

/* Scanlines with color separation */
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 200;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 2px,
    rgba(0,0,0,.12) 2px 3px,
    rgba(0,0,0,.05) 3px 4px
  );
  animation: flicker 0.15s infinite;
}

/* Chromatic aberration / color fringing */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 199;
  background: 
    linear-gradient(90deg, rgba(255,0,0,.03) 0%, transparent 3%, transparent 97%, rgba(0,255,255,.03) 100%);
}

/* Subtle screen flicker */
@keyframes flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.98; }
  25%, 75% { opacity: 0.99; }
}

/* Random noise overlay */
.noise-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 198;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  animation: noise 0.5s steps(5) infinite;
}
@keyframes noise {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-2px, 1px); }
  40% { transform: translate(1px, -1px); }
  60% { transform: translate(-1px, 2px); }
  80% { transform: translate(2px, -2px); }
}

/* Occasional tracking distortion - applied to inner wrapper */
@keyframes tracking {
  0%, 95%, 100% { transform: translateX(0) skewX(0); }
  96% { transform: translateX(-3px) skewX(-0.5deg); }
  97% { transform: translateX(2px) skewX(0.3deg); }
  98% { transform: translateX(-1px) skewX(-0.2deg); }
  99% { transform: translateX(1px) skewX(0.1deg); }
}
.tracking-wrapper {
  width: 100%; height: 100%;
  flex: 1;
  position: relative;
  display: flex; flex-direction: column;
  animation: tracking 8s ease-in-out infinite;
}

/* Screen wipe transition */
.screen-wipe {
  position: fixed; inset: 0; z-index: 250;
  background: var(--bg);
  transform: translateY(-100%);
  pointer-events: none;
}
.screen-wipe.active {
  animation: wipeDown 0.4s ease-in-out;
}
@keyframes wipeDown {
  0% { transform: translateY(-100%); }
  45%, 55% { transform: translateY(0); }
  100% { transform: translateY(100%); }
}

/* Phosphor glow on bright elements - subtle version */
.glow-green {
  text-shadow: 0 0 4px rgba(82,255,143,.4), 0 0 8px rgba(82,255,143,.2);
}
.glow-gold {
  text-shadow: 0 0 4px rgba(255,210,74,.4), 0 0 8px rgba(255,210,74,.2);
}
.glow-red {
  text-shadow: 0 0 4px rgba(255,90,103,.4), 0 0 8px rgba(255,90,103,.2);
}

/* Blinking cursor */
.blink-cursor::after {
  content: '█';
  animation: blink 0.8s steps(2) infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* Blinking prompt (INSERT COIN style) */
.blink-prompt {
  animation: blinkPrompt 1s steps(2) infinite;
}
@keyframes blinkPrompt {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Typewriter effect container */
.typewriter.typing {
  border-right: 2px solid var(--txt);
  animation: typeCursor 0.7s steps(2) infinite;
}
@keyframes typeCursor {
  0%, 100% { border-color: var(--txt); }
  50% { border-color: transparent; }
}

/* Dithering pattern backgrounds */
.dither-dark {
  background-image: url("data:image/svg+xml,%3Csvg width='4' height='4' viewBox='0 0 4 4' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='0' width='1' height='1' fill='rgba(0,0,0,0.3)'/%3E%3Crect x='2' y='2' width='1' height='1' fill='rgba(0,0,0,0.3)'/%3E%3C/svg%3E");
}
.dither-light {
  background-image: url("data:image/svg+xml,%3Csvg width='4' height='4' viewBox='0 0 4 4' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='0' width='1' height='1' fill='rgba(255,255,255,0.1)'/%3E%3Crect x='2' y='2' width='1' height='1' fill='rgba(255,255,255,0.1)'/%3E%3C/svg%3E");
}

/* Remove all border-radius for sharp pixelated corners */
.btn, .select-card, .mini-card, .card-tooltip, .flag, .flag-tooltip,
.big-card, .reveal-slot, .wildcard, .consequences, .side-portrait,
.meter .bar, .ending-winner {
  border-radius: 0 !important;
}

/* Game container */
#game {
  width: 1280px; height: 720px;
  margin: auto; position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg);
  overflow: visible;
  display: flex; flex-direction: column;
}

/* ════════════════════════════════════════════════════════════════════════════
   TITLE SCREEN
   ════════════════════════════════════════════════════════════════════════════ */
.screen {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  background: var(--bg);
}
.screen.active { display: flex; }

#screen-title {
  align-items: center; justify-content: center; gap: 24px;
}
#screen-title h1 {
  font-family: var(--px); font-size: 42px; letter-spacing: .2em;
  color: var(--grn); text-shadow: 0 0 40px rgba(82,255,143,.5);
}
#screen-title .subtitle {
  font-family: var(--vt); font-size: 36px; color: var(--gold);
}
#screen-title .subtitle-fa {
  font-family: var(--fa); font-size: 30px; color: var(--gold); direction: rtl;
}
.content-warning {
  font-family: var(--vt);
  font-size: 22px;
  color: var(--red);
  text-align: center;
  line-height: 1.5;
  margin-top: 20px;
  padding: 16px 24px;
  border: 2px solid rgba(255,90,103,.5);
  background: rgba(255,90,103,.08);
  max-width: 550px;
}
.content-warning .warning-icon {
  font-size: 28px;
  margin-right: 8px;
  color: var(--gold);
  text-shadow: 0 0 10px rgba(255,213,74,.6);
}
.content-warning strong {
  color: var(--red);
  text-transform: uppercase;
  letter-spacing: .05em;
}
.btn {
  font-family: var(--px); font-size: 13px; letter-spacing: .1em;
  padding: 14px 28px; cursor: pointer;
  background: rgba(82,255,143,.08); border: 3px solid var(--grn); color: var(--grn);
  transition: filter .15s, transform .1s, box-shadow .15s;
  box-shadow: 0 0 10px rgba(82,255,143,.3), inset 0 0 20px rgba(82,255,143,.05);
  text-shadow: 0 0 8px rgba(82,255,143,.5);
}
.btn:hover { 
  filter: brightness(1.4); 
  box-shadow: 0 0 20px rgba(82,255,143,.5), inset 0 0 30px rgba(82,255,143,.1);
}
.btn:active { 
  transform: scale(.96); 
  box-shadow: 0 0 5px rgba(82,255,143,.3);
}
.btn.red { background: rgba(255,90,103,.08); border-color: var(--red); color: var(--red); }
.btn-inline {
  font-size: 11px;
  padding: 8px 20px;
  margin-top: 8px;
}

/* Global language toggle - fixed at bottom right, always LTR */
.lang-toggle-global {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: row;
  gap: 8px;
  z-index: 9999;
  background: rgba(6,8,12,0.85);
  padding: 8px 16px;
  border: 1px solid var(--bdr);
  border-radius: 4px;
  direction: ltr;
}

/* Center language toggle on title screen */
.lang-toggle-global.centered {
  right: auto;
  left: 50%;
  transform: translateX(-50%);
}
.lang-btn {
  font-family: var(--px);
  font-size: 11px;
  padding: 10px 20px;
  background: transparent;
  border: 2px solid var(--bdr);
  color: var(--dim);
  cursor: pointer;
  transition: all .2s;
  letter-spacing: .1em;
}
.lang-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
}
.lang-btn.active {
  border-color: var(--grn);
  color: var(--grn);
  background: rgba(82,255,143,.15);
  box-shadow: 0 0 10px rgba(82,255,143,.3);
}
.lang-btn[data-lang="fa"] {
  font-family: var(--fa);
  font-size: 14px;
  letter-spacing: 0;
}

/* ════════════════════════════════════════════════════════════════════════════
   AUDIO TOGGLES
   ════════════════════════════════════════════════════════════════════════════ */

/* Global mini audio toggles - positioned with language toggle */
.audio-toggles-global {
  display: flex;
  gap: 4px;
  margin-right: 10px;
  padding-right: 10px;
  border-right: 1px solid var(--bdr);
}
.audio-mini {
  font-family: var(--px);
  font-size: 8px;
  padding: 6px 10px;
  background: transparent;
  border: 1px solid var(--bdr);
  color: var(--dim);
  cursor: pointer;
  transition: all .2s;
  letter-spacing: .05em;
}
.audio-mini:hover {
  border-color: var(--gold);
  color: var(--gold);
}
.audio-mini.active {
  border-color: var(--grn);
  color: var(--grn);
  background: rgba(82,255,143,.1);
}
.audio-mini.off {
  border-color: var(--r2);
  color: var(--r2);
  opacity: 0.6;
}

/* Hide global toggles on title screen (use the prominent ones instead) */
#screen-title.active ~ .lang-toggle-global .audio-toggles-global {
  display: none;
}

/* Volume controls */
.volume-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-right: 10px;
  padding-right: 10px;
  border-right: 1px solid var(--bdr);
}
.volume-group {
  display: flex;
  align-items: center;
  gap: 4px;
}
.volume-label {
  font-family: var(--px);
  font-size: 7px;
  color: var(--dim);
  letter-spacing: .05em;
}
.volume-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 50px;
  height: 4px;
  background: var(--bdr);
  border-radius: 0;
  outline: none;
  cursor: pointer;
}
.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 8px;
  height: 12px;
  background: var(--grn);
  border: none;
  cursor: pointer;
}
.volume-slider::-moz-range-thumb {
  width: 8px;
  height: 12px;
  background: var(--grn);
  border: none;
  border-radius: 0;
  cursor: pointer;
}
.volume-slider:hover::-webkit-slider-thumb {
  background: var(--gold);
}
.volume-slider:hover::-moz-range-thumb {
  background: var(--gold);
}

/* Hide volume on title screen */
#screen-title.active ~ .lang-toggle-global .volume-controls {
  display: none;
}

/* ════════════════════════════════════════════════════════════════════════════
   SELECT SCREEN
   ════════════════════════════════════════════════════════════════════════════ */
#screen-select {
  align-items: center; justify-content: center; gap: 40px;
}
#screen-select h1 {
  font-family: var(--px); font-size: 18px; letter-spacing: .15em; color: var(--grn);
}
.select-row { display: flex; gap: 60px; }
.select-card {
  width: 260px; padding: 24px; border-radius: 6px;
  border: 3px solid; background: rgba(6,8,12,.7);
  cursor: pointer; text-align: center;
  transition: transform .2s, box-shadow .2s;
}
.select-card:hover { transform: translateY(-8px); }
.select-card.trump { border-color: var(--grn); color: var(--grn); }
.select-card.trump:hover { box-shadow: 0 0 30px rgba(82,255,143,.3); }
.select-card.irgc { border-color: var(--red); color: var(--red); }
.select-card.irgc:hover { box-shadow: 0 0 30px rgba(255,90,103,.3); }
.select-card h2 { font-family: var(--px); font-size: 14px; margin-bottom: 12px; }
.select-card p { font-family: var(--vt); font-size: 18px; color: var(--txt); line-height: 1.4; }

/* ════════════════════════════════════════════════════════════════════════════
   MAIN GAME SCREEN
   ════════════════════════════════════════════════════════════════════════════ */
#screen-game {
  flex-direction: column;
}

/* Side panels: Meters + Card roster in columns */
.side-panel {
  display: flex; flex-direction: column;
  width: 140px;
  background: rgba(6,8,12,.6);
  overflow: visible;
  position: relative;
  z-index: 50;
}
.side-panel.trump { border-right: 1px solid var(--bdr); }
.side-panel.irgc { border-left: 1px solid var(--bdr); }

/* Side header with portrait */
.side-header {
  position: relative;
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 8px;
  border-bottom: 1px solid var(--bdr);
  gap: 8px;
}
.side-label {
  font-family: var(--px); font-size: 10px; letter-spacing: .1em;
  text-align: center;
}
.side-header.trump .side-label { color: var(--grn); }
.side-header.irgc .side-label { color: var(--red); }
.side-portrait {
  width: 64px; height: 64px;
  border: 2px solid var(--bdr);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--px); font-size: 6px; color: var(--dim);
  background: rgba(0,0,0,.4);
}
.side-header.trump .side-portrait { border-color: var(--grn); }
.side-header.irgc .side-portrait { border-color: var(--red); }

.side-quote {
  position: absolute;
  font-family: var(--vt); font-size: 16px;
  color: #1a1a1a;
  text-align: left;
  line-height: 1.3;
  padding: 10px 12px;
  width: 180px;
  background: #f5f5ed;
  border: 2px solid #ccc;
  border-radius: 12px;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.9);
  transition: opacity .3s ease, transform .3s ease;
  z-index: 100;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
}
.side-quote.active {
  opacity: 1;
  transform: scale(1);
}
/* Trump quote - appears to the right */
.side-header.trump .side-quote {
  left: 100%;
  top: 50%;
  transform: translateY(-50%) scale(0.9);
  margin-left: 12px;
  border-color: #52ff8f;
  background: linear-gradient(135deg, #eaffef 0%, #d5f5dc 100%);
}
.side-header.trump .side-quote::before {
  content: '';
  position: absolute;
  left: -12px; top: 50%; transform: translateY(-50%);
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
  border-right: 12px solid #52ff8f;
}
.side-header.trump .side-quote::after {
  content: '';
  position: absolute;
  left: -9px; top: 50%; transform: translateY(-50%);
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-right: 10px solid #eaffef;
}
.side-header.trump .side-quote.active {
  transform: translateY(-50%) scale(1);
}
/* IRGC quote - appears to the left */
.side-header.irgc .side-quote {
  right: 100%;
  top: 50%;
  transform: translateY(-50%) scale(0.9);
  margin-right: 12px;
  border-color: #ff5a67;
  background: linear-gradient(135deg, #fff0f0 0%, #fdd 100%);
}
.side-header.irgc .side-quote::before {
  content: '';
  position: absolute;
  right: -12px; top: 50%; transform: translateY(-50%);
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
  border-left: 12px solid #ff5a67;
}
.side-header.irgc .side-quote::after {
  content: '';
  position: absolute;
  right: -9px; top: 50%; transform: translateY(-50%);
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-left: 10px solid #fff0f0;
}
.side-header.irgc .side-quote.active {
  transform: translateY(-50%) scale(1);
}

.meter-group {
  display: flex; flex-direction: column; gap: 6px;
  padding: 10px 8px;
  border-bottom: 1px solid var(--bdr);
}
.meter {
  display: flex; flex-direction: column; gap: 2px;
}
.meter .name {
  font-family: var(--px); font-size: 8px; color: var(--dim);
  letter-spacing: .05em;
}
.meter .bar-row {
  display: flex; align-items: center; gap: 4px;
}
.meter .bar {
  flex: 1; height: 8px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 2px; overflow: hidden;
}
.meter .fill {
  height: 100%; transition: width .5s ease;
}
.fill.green { 
  background: linear-gradient(90deg, #1ecc5e, #52ff8f); 
  box-shadow: 0 0 6px rgba(82,255,143,.6), inset 0 0 3px rgba(255,255,255,.3);
}
.fill.gold { 
  background: linear-gradient(90deg, #c89a1f, #ffd24a); 
  box-shadow: 0 0 6px rgba(255,210,74,.6), inset 0 0 3px rgba(255,255,255,.3);
}
.fill.cyan { 
  background: linear-gradient(90deg, #1f9ec0, #5ad7ff); 
  box-shadow: 0 0 6px rgba(90,215,255,.6), inset 0 0 3px rgba(255,255,255,.3);
}
.fill.red { 
  background: linear-gradient(90deg, #c0222e, #ff5a67); 
  box-shadow: 0 0 6px rgba(255,90,103,.6), inset 0 0 3px rgba(255,255,255,.3);
}
.fill.orange { 
  background: linear-gradient(90deg, #c46b1c, #ff9e3a); 
  box-shadow: 0 0 6px rgba(255,158,58,.6), inset 0 0 3px rgba(255,255,255,.3);
}
.fill.magenta { 
  background: linear-gradient(90deg, #c01c9c, #ff5ad7); 
  box-shadow: 0 0 6px rgba(255,90,215,.6), inset 0 0 3px rgba(255,255,255,.3);
}
.meter .val {
  font-family: var(--px); font-size: 10px; color: var(--txt);
  min-width: 20px; text-align: right;
}

/* Meter tooltips */
.meter {
  position: relative;
  cursor: help;
}
.meter-tooltip {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgb(6,8,12);
  border: 2px solid var(--gold);
  padding: 10px;
  width: 180px;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  box-shadow: 0 4px 16px rgba(0,0,0,.8);
}
.side-panel.trump .meter-tooltip {
  left: 100%;
  margin-left: 8px;
}
.side-panel.irgc .meter-tooltip {
  right: 100%;
  margin-right: 8px;
}
.meter:hover .meter-tooltip {
  opacity: 1;
}
.meter-tooltip .mt-title {
  font-family: var(--px);
  font-size: 9px;
  margin-bottom: 6px;
  letter-spacing: .08em;
}
.side-panel.trump .meter-tooltip .mt-title { color: var(--grn); }
.side-panel.irgc .meter-tooltip .mt-title { color: var(--red); }
.meter-tooltip .mt-desc {
  font-family: var(--vt);
  font-size: 15px;
  color: var(--txt);
  line-height: 1.3;
  margin-bottom: 8px;
}
.meter-tooltip .mt-effects {
  font-family: var(--px);
  font-size: 7px;
  color: var(--dim);
  padding-top: 6px;
  border-top: 1px dashed var(--bdr);
}
.meter-tooltip .mt-win {
  font-family: var(--px);
  font-size: 8px;
  color: var(--gold);
  margin-top: 6px;
}

/* Main area: Roster | Board | Roster - centered together */
.main-area {
  flex: 1; display: flex; min-height: 0;
  justify-content: center;
}

/* Select instruction */
.select-instruction {
  font-family: var(--px); font-size: 9px;
  text-align: center;
  padding: 6px 4px;
  color: var(--dim);
  background: rgba(255,255,255,.02);
  border-bottom: 1px dashed var(--bdr);
  opacity: 0.3;
  transition: opacity .3s, color .3s, background .3s, border-color .3s;
}
.select-instruction.active {
  color: var(--gold);
  background: rgba(255,210,74,.1);
  border-color: var(--gold);
  opacity: 1;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* Card rosters inside side panels */
.roster-panel {
  flex: 1;
  padding: 8px;
  display: flex; flex-direction: column; gap: 5px;
  overflow: visible;
}
.roster-panel .header {
  font-family: var(--px); font-size: 9px; letter-spacing: .1em;
  text-align: center; padding-bottom: 4px;
  border-bottom: 1px dashed var(--bdr);
}
.roster-panel.trump .header { color: var(--grn); }
.roster-panel.irgc .header { color: var(--red); }

.mini-card {
  padding: 6px 4px;
  border: 2px solid; border-radius: 3px;
  background: rgba(6,8,12,.6);
  font-family: var(--px); font-size: 8px;
  text-align: center; cursor: pointer;
  transition: transform .15s, box-shadow .15s, filter .15s;
  line-height: 1.3;
}
.mini-card:not(.playable):not(.disabled) {
  opacity: .6;
}
.mini-card.trump { border-color: var(--grn); color: var(--grn); }
.mini-card.irgc { border-color: var(--red); color: var(--red); }
.mini-card.playable {
  cursor: pointer;
}
.mini-card.playable:hover {
  border-color: var(--gold); color: var(--gold);
  box-shadow: 0 0 12px rgba(255,210,74,.4);
}
/* Trump cards shift towards center (right in LTR, left in RTL) */
.mini-card.trump.playable:hover {
  transform: translateX(8px);
}
/* IRGC cards shift towards center (left in LTR, right in RTL) */
.mini-card.irgc.playable:hover {
  transform: translateX(-8px);
}
.mini-card.disabled {
  opacity: .35; cursor: not-allowed; filter: grayscale(.5);
}
.mini-card .cooldown {
  font-size: 7px; color: var(--dim); margin-left: 4px;
  display: inline;
}
.mini-card {
  position: relative;
}
.card-tooltip {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  background: rgb(6,8,12);
  border: 2px solid var(--gold);
  border-radius: 6px;
  padding: 12px;
  width: 200px;
  z-index: 9999;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
  box-shadow: 0 6px 24px rgba(0,0,0,.9);
}
.mini-card.trump .card-tooltip {
  left: 100%; margin-left: 8px;
  right: auto; margin-right: 0;
}
.mini-card.irgc .card-tooltip {
  right: 100%; margin-right: 8px;
  left: auto; margin-left: 0;
}
/* Show tooltips on all cards when in select phase */
.tooltips-enabled .mini-card:hover .card-tooltip {
  opacity: 1;
}
.card-tooltip .tooltip-header {
  font-family: var(--px); font-size: 11px;
  text-align: center; margin-bottom: 8px;
  letter-spacing: .1em; color: var(--txt);
}
.card-tooltip .tooltip-art {
  height: 80px; background: rgba(255,255,255,.05);
  border: 1px solid var(--bdr); border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; color: var(--dim);
  margin-bottom: 8px;
}
.card-tooltip .tooltip-desc {
  font-family: var(--vt); font-size: 17px;
  color: var(--dim); line-height: 1.4;
  padding: 8px 10px; margin-bottom: 8px;
  background: rgba(0,0,0,.3);
  border-radius: 2px;
}
.card-tooltip .tooltip-effects {
  display: flex; gap: 12px;
}
.card-tooltip .effect-col {
  flex: 1; display: flex; flex-direction: column; gap: 3px;
}
.card-tooltip .effect-col-label {
  font-family: var(--px); font-size: 8px;
  letter-spacing: .1em; margin-bottom: 2px;
  border-bottom: 1px dashed var(--bdr); padding-bottom: 2px;
}
.card-tooltip .effect-col.trump .effect-col-label { color: var(--grn); }
.card-tooltip .effect-col.irgc .effect-col-label { color: var(--red); }
.card-tooltip .effect-item {
  font-family: var(--px); font-size: 9px;
}
.card-tooltip .effect-item.positive { color: var(--grn); }
.card-tooltip .effect-item.negative { color: var(--red); }
.card-tooltip .effect-item.zero { color: var(--dim); }

/* Night transition for board */
.board.night-fade .map-area,
.board.night-fade .board-day,
.board.night-fade .board-date,
.board.night-fade .board-story {
  opacity: 0;
}
.map-area,
.board-day,
.board-date,
.board-story {
  transition: opacity 0.6s ease;
}

/* Center board */
.board {
  width: 700px;
  position: relative;
  display: flex; flex-direction: column;
  background: rgba(6,8,12,.4);
  overflow: hidden;
}

/* Status flags on the board */
.flags-container {
  position: absolute; inset: 0;
  pointer-events: none;
}
.flag {
  position: absolute;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 10px;
  border: 1px solid var(--bdr); border-radius: 4px;
  font-family: var(--px); font-size: 8px;
  color: var(--dim); background: rgba(6,8,12,.7);
  opacity: .3; transition: opacity .3s, border-color .3s, color .3s, transform .3s;
  pointer-events: auto;
  cursor: help;
}
.flag.active {
  opacity: 1; border-color: var(--gold); color: var(--gold);
  background: rgba(6,8,12,.9);
  transform: scale(1.05);
}
.flag .icon { font-size: 18px; line-height: 1; }
.flag .flag-label { text-align: center; line-height: 1.2; }

/* Flag tooltips */
.flag-tooltip {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-bottom: 8px;
  background: rgba(6,8,12,.98);
  border: 2px solid var(--gold);
  border-radius: 6px;
  padding: 12px;
  width: 220px;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  box-shadow: 0 6px 24px rgba(0,0,0,.8);
}
.flag:hover .flag-tooltip {
  opacity: 1;
}
.flag-tooltip .ft-title {
  font-family: var(--px);
  font-size: 10px;
  color: var(--gold);
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: .1em;
}
.flag-tooltip .ft-desc {
  font-family: var(--vt);
  font-size: 16px;
  color: var(--txt);
  line-height: 1.4;
  margin-bottom: 10px;
}
.flag-tooltip .ft-effects {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-top: 8px;
  border-top: 1px dashed var(--bdr);
}
.flag-tooltip .ft-effect {
  font-family: var(--px);
  font-size: 9px;
}
.flag-tooltip .ft-effect.trump { color: var(--grn); }
.flag-tooltip .ft-effect.irgc { color: var(--red); }
.flag-tooltip .ft-effect.neutral { color: var(--dim); }

/* Flags near top: show tooltip below */
.flag[data-flag="INTERNET_SHUTDOWN"] .flag-tooltip,
.flag[data-flag="STARLINK"] .flag-tooltip {
  bottom: auto;
  top: 100%;
  margin-bottom: 0;
  margin-top: 8px;
}

/* Flag positions on the board */
.flag[data-flag="CARRIER_GROUP"] { top: 50%; left: 15%; transform: translateY(-50%); }
.flag[data-flag="BLOCKADE"] { top: 60%; left: 30%; }
.flag[data-flag="INTERNET_SHUTDOWN"] { top: 25%; left: 50%; transform: translateX(-50%); }
.flag[data-flag="STARLINK"] { top: 25%; right: 20%; }
.flag[data-flag="IRAQI_PMF"] { top: 45%; right: 15%; }
.flag[data-flag="FATEMIYOUN"] { top: 60%; right: 20%; }
.flag[data-flag="PROTESTS"] { bottom: 25%; left: 50%; transform: translateX(-50%); }
.flag[data-flag="STRIKE"] { bottom: 20%; left: 25%; }
.flag[data-flag="BASIJ_DEFECT"] { bottom: 20%; right: 25%; }
.flag.active[data-flag="CARRIER_GROUP"] { transform: translateY(-50%) scale(1.05); }
.flag.active[data-flag="INTERNET_SHUTDOWN"] { transform: translateX(-50%) scale(1.05); }
.flag.active[data-flag="PROTESTS"] { transform: translateX(-50%) scale(1.05); }

/* Map area */
.map-area {
  flex: 1; position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.map-bg {
  position: absolute; inset: 0;
  background: 
    /* Grid lines suggesting a situation map */
    linear-gradient(rgba(82,255,143,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(82,255,143,.03) 1px, transparent 1px),
    /* Regional glows */
    radial-gradient(ellipse at 30% 50%, rgba(82,255,143,.08) 0%, transparent 40%),
    radial-gradient(ellipse at 70% 50%, rgba(255,90,103,.08) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 70%, rgba(255,210,74,.05) 0%, transparent 30%);
  background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%, 100% 100%;
}

/* Board header with date and story */
.board-header {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 16px 20px;
  background: linear-gradient(to bottom, rgba(6,8,12,.9) 0%, rgba(6,8,12,.7) 70%, transparent 100%);
  z-index: 5;
}
.board-day {
  font-family: var(--px); font-size: 20px; color: var(--gold);
  text-shadow: 0 0 20px rgba(255,210,74,.4);
  letter-spacing: .15em;
}
.board-date {
  font-family: var(--px); font-size: 12px; color: var(--dim);
  margin-bottom: 8px;
  letter-spacing: .1em;
}
.board-day-label-unused {
  font-family: var(--px); font-size: 8px; color: var(--dim);
  letter-spacing: .15em; margin-bottom: 12px;
}
.board-story {
  font-family: var(--vt); font-size: 18px; color: var(--txt);
  line-height: 1.4; max-width: 600px;
}
.board-story .headline {
  color: var(--gold); font-family: var(--px); font-size: 12px;
  letter-spacing: .1em; margin-bottom: 6px;
}

/* Card reveal area */
.reveal-area {
  position: absolute; inset: 0; z-index: 10;
  display: flex;
  align-items: center; justify-content: center; gap: 40px;
  background: rgba(6,8,12,.85);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.reveal-area.show { 
  opacity: 1;
  pointer-events: auto;
}
.reveal-slot {
  width: 180px; height: 260px;
  border: 2px solid var(--bdr); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(6,8,12,.8);
}
.reveal-slot.trump { border-color: rgba(82,255,143,.5); }
.reveal-slot.irgc { border-color: rgba(255,90,103,.5); }
.reveal-slot.hidden-card {
  position: relative;
}
.reveal-slot.hidden-card::after {
  content: '?';
  font-family: var(--px);
  font-size: 48px;
  color: var(--dim);
  opacity: .5;
}

/* Card back (face-down) */
.card-back {
  width: 170px; height: 250px;
  border: 3px solid var(--bdr); border-radius: 6px;
  background: rgba(6,8,12,.95);
  display: flex; align-items: center; justify-content: center;
}
.card-back::after {
  content: '?';
  font-family: var(--px);
  font-size: 40px;
  color: var(--dim);
  opacity: .4;
}
.card-back.trump { border-color: rgba(82,255,143,.4); }
.card-back.irgc { border-color: rgba(255,90,103,.4); }

.big-card {
  width: 170px; height: 250px;
  border: 3px solid; border-radius: 6px;
  background: rgba(6,8,12,.9);
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Slot animations - controlled by class */
.reveal-slot {
  transition: transform .4s ease, opacity .4s ease;
}
.reveal-slot.trump { transform-origin: left center; }
.reveal-slot.irgc { transform-origin: right center; }

/* Slide in state */
.reveal-slot.slide-in {
  animation: none;
}
.reveal-slot.trump.slide-in {
  animation: slotSlideFromLeft .4s ease-out;
}
.reveal-slot.irgc.slide-in {
  animation: slotSlideFromRight .4s ease-out;
}

/* Slide out state */
.reveal-slot.slide-out {
  opacity: 0;
}
.reveal-slot.trump.slide-out {
  transform: translateX(-100px);
}
.reveal-slot.irgc.slide-out {
  transform: translateX(100px);
}

@keyframes slotSlideFromLeft {
  from { opacity: 0; transform: translateX(-100px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes slotSlideFromRight {
  from { opacity: 0; transform: translateX(100px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Flip animation for card reveal */
.big-card.flip {
  animation: cardFlip .4s ease-out;
}
@keyframes cardFlip {
  from { transform: rotateY(90deg); opacity: 0; }
  to { transform: rotateY(0); opacity: 1; }
}
.big-card.trump { border-color: var(--grn); }
.big-card.irgc { border-color: var(--red); }
.big-card .card-header {
  padding: 10px 8px;
  font-family: var(--px); font-size: 11px; letter-spacing: .08em;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.big-card.trump .card-header { color: var(--grn); background: rgba(82,255,143,.08); }
.big-card.irgc .card-header { color: var(--red); background: rgba(255,90,103,.08); }
.big-card .card-art {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.3);
  font-family: var(--px); font-size: 7px; color: var(--dim);
  text-align: center; padding: 8px;
}
.big-card .card-voice {
  padding: 10px 8px;
  font-family: var(--vt); font-size: 15px; font-style: italic;
  color: var(--dim); text-align: center;
  border-top: 1px solid rgba(255,255,255,.1);
  line-height: 1.3;
}

.vs-badge {
  font-family: var(--px); font-size: 16px; color: var(--gold);
  text-shadow: 0 0 20px rgba(255,210,74,.5);
}

/* Wildcard overlay - full center display */
.wildcard {
  position: absolute; top: 50%; left: 50%; 
  transform: translate(-50%, -50%) scale(0.9);
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  padding: 24px;
  background: rgba(6,8,12,.98);
  border: 3px solid var(--gold); border-radius: 8px;
  box-shadow: 0 0 60px rgba(255,210,74,.3);
  max-width: 480px;
  z-index: 25;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.wildcard.show {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}
.wildcard.show { display: flex; }
.wildcard .wc-content {
  display: flex; align-items: flex-start; gap: 16px;
}
.wildcard .wc-portrait {
  width: 72px; height: 72px;
  border: 2px solid var(--gold); border-radius: 6px;
  background: rgba(0,0,0,.4);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--px); font-size: 6px; color: var(--dim);
  flex-shrink: 0;
}
.wildcard .wc-message {
  position: relative;
  display: flex; flex-direction: column; gap: 6px;
  background: #f5f5ed;
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 12px 14px;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
}
.wildcard .wc-message::before {
  content: '';
  position: absolute;
  left: -12px; top: 20px;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
  border-right: 12px solid var(--gold);
}
.wildcard .wc-message::after {
  content: '';
  position: absolute;
  left: -9px; top: 22px;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-right: 10px solid #f5f5ed;
}
.wildcard .wc-character {
  font-family: var(--px); font-size: 9px; letter-spacing: .1em; 
  color: #666;
  text-transform: uppercase;
}
.wildcard .wc-quote {
  font-family: var(--vt); font-size: 18px;
  color: #1a1a1a; line-height: 1.3;
}
.wildcard .wc-effect {
  font-family: var(--px); font-size: 10px; color: var(--gold);
  padding: 8px 14px;
  border: 2px solid var(--gold);
  border-radius: 6px;
  background: rgba(255,210,74,.15);
}

/* Consequences overlay - two columns with button */
.consequences {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 16px 24px;
  background: rgba(6,8,12,.95);
  border: 2px solid var(--bdr); border-radius: 6px;
  font-family: var(--px); font-size: 11px;
  z-index: 15;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.consequences.show { 
  opacity: 1;
  pointer-events: auto;
}
.consequences-content {
  display: flex; gap: 30px;
  flex-wrap: wrap;
  justify-content: center;
}
.consequences .column {
  display: flex; flex-direction: column; gap: 4px;
  min-width: 100px;
}
.consequences .column-label {
  font-size: 10px; letter-spacing: .1em;
  padding-bottom: 4px; margin-bottom: 4px;
  border-bottom: 1px dashed var(--bdr);
}
.consequences .column.trump .column-label { color: var(--grn); }
.consequences .column.irgc .column-label { color: var(--red); }
.consequences .effect {
  color: var(--dim);
}
.consequences .effect.positive { color: var(--grn); }
.consequences .effect.negative { color: var(--red); }
.consequences .effect.blocked { color: var(--gold); font-style: italic; }

/* Ongoing flag effects in consequences */
.consequences .flag-effects-row {
  width: 100%;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--bdr);
}
.consequences .flag-effects-label {
  font-size: 8px;
  color: var(--dim);
  text-align: center;
  margin-bottom: 6px;
  letter-spacing: .1em;
}
.consequences .flag-effects-cols {
  display: flex;
  gap: 30px;
  justify-content: center;
}
.consequences .effect.flag-effect {
  font-size: 8px;
  opacity: 0.8;
}

/* Phase indicator */
.phase-indicator {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  font-family: var(--px); font-size: 10px;
}
.phase-indicator:empty {
  display: none;
  color: var(--gold); letter-spacing: .12em;
  background: rgba(6,8,12,.9);
  padding: 10px 20px; border-radius: 4px;
  border: 2px solid var(--gold);
  box-shadow: 0 0 20px rgba(255,210,74,.2);
  z-index: 5;
}

/* Action bar */
.action-bar {
  padding: 10px;
  border-top: 1px solid var(--bdr);
  display: flex; justify-content: center;
  background: rgba(6,8,12,.8);
}

/* ════════════════════════════════════════════════════════════════════════════
   ENDING SCREEN
   ════════════════════════════════════════════════════════════════════════════ */
#screen-ending {
  align-items: center; justify-content: center; gap: 24px; padding: 40px;
}
.ending-winner {
  font-family: var(--px); font-size: 14px; letter-spacing: .2em;
  padding: 8px 20px;
  border: 2px solid;
  border-radius: 4px;
}
.ending-winner.trump-win { 
  color: var(--grn); 
  border-color: var(--grn);
  background: rgba(82,255,143,.1);
}
.ending-winner.irgc-win { 
  color: var(--red); 
  border-color: var(--red);
  background: rgba(255,90,103,.1);
}
.ending-winner.stalemate { 
  color: var(--gold); 
  border-color: var(--gold);
  background: rgba(255,210,74,.1);
}
.ending-title {
  font-family: var(--px); font-size: 24px; letter-spacing: .15em;
  text-shadow: 0 0 30px;
}
.ending-title.trump-win { color: var(--grn); }
.ending-title.irgc-win { color: var(--red); }
.ending-title.stalemate { color: var(--gold); }
.ending-desc {
  font-family: var(--vt); font-size: 22px;
  color: var(--txt); text-align: center;
  max-width: 700px; line-height: 1.5;
}
.ending-stats {
  font-family: var(--px); font-size: 11px;
  color: var(--dim); letter-spacing: .08em;
}

/* ════════════════════════════════════════════════════════════════════════════
   STORY SCREENS - CIA President's Daily Brief Style
   ════════════════════════════════════════════════════════════════════════════ */
#screen-story {
  align-items: center; justify-content: center; padding: 30px;
}
.story-container {
  width: 680px;
  background: #f5f5eb;
  border: 1px solid #999;
  box-shadow: 4px 4px 0 rgba(0,0,0,.3), 0 0 40px rgba(0,0,0,.5);
  position: relative;
}

/* Classification header */
.pdb-header {
  background: linear-gradient(to bottom, #1a1a1a, #2a2a2a);
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 3px solid #c00;
}
.pdb-classification {
  font-family: var(--px);
  font-size: 11px;
  color: #ff3333;
  letter-spacing: .15em;
  text-shadow: 0 0 10px rgba(255,0,0,.5);
}
.pdb-seal {
  width: 50px;
  height: 50px;
  border: 2px solid #666;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--px);
  font-size: 6px;
  color: #888;
  background: #1a1a1a;
}

/* Document title bar */
.pdb-title-bar {
  background: #2a2a2a;
  padding: 10px 20px;
  border-bottom: 1px solid #444;
}
.pdb-title {
  font-family: var(--px);
  font-size: 10px;
  color: #ccc;
  letter-spacing: .2em;
}

/* Document body */
.pdb-body {
  padding: 25px 30px;
  color: #1a1a1a;
}
.pdb-date {
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: #444;
  margin-bottom: 5px;
}
.pdb-subject {
  font-family: 'Courier New', monospace;
  font-size: 14px;
  font-weight: bold;
  color: #000;
  text-transform: uppercase;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid #000;
}
.pdb-content {
  font-family: 'Courier New', monospace;
  font-size: 15px;
  color: #1a1a1a;
  line-height: 1.7;
  text-align: left;
}
.pdb-content em {
  font-style: normal;
  background: rgba(255,255,0,.3);
  padding: 0 3px;
}
.pdb-content .redacted {
  background: #000;
  color: #000;
  padding: 0 20px;
  user-select: none;
}

/* Intelligence quote/source */
.pdb-intel {
  margin: 20px 0;
  padding: 15px;
  background: rgba(0,0,0,.05);
  border-left: 4px solid #c00;
}
.pdb-intel-quote {
  font-family: 'Courier New', monospace;
  font-size: 14px;
  font-style: italic;
  color: #333;
  margin-bottom: 8px;
}
.pdb-intel-source {
  font-family: var(--px);
  font-size: 8px;
  color: #666;
  letter-spacing: .1em;
}

/* Document footer */
.pdb-footer {
  background: #2a2a2a;
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid #444;
}
.pdb-page {
  font-family: var(--px);
  font-size: 9px;
  color: #666;
}
.pdb-stamp {
  font-family: var(--px);
  font-size: 8px;
  color: #c00;
  border: 2px solid #c00;
  padding: 4px 10px;
  transform: rotate(-3deg);
  letter-spacing: .1em;
}

/* Navigation */
.story-nav {
  display: flex;
  justify-content: center;
  padding: 20px;
  background: transparent;
}
.story-progress {
  display: flex;
  gap: 6px;
  position: absolute;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);
}
.story-dot {
  width: 6px;
  height: 6px;
  background: #444;
}
.story-dot.active {
  background: #c00;
}
.story-dot.seen {
  background: #888;
}

/* ════════════════════════════════════════════════════════════════════════════
   STORY SCREENS - Cinematic Mode (image-centered panels)
   ════════════════════════════════════════════════════════════════════════════ */
.story-cinematic {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 40px 30px 60px;
  text-align: center;
  width: 100%;
  height: 100%;
}
.story-cinematic.active {
  display: flex;
}
.story-img-wrap {
  flex: 0 1 auto;
  width: min(70vw, 720px);
  aspect-ratio: 16/9;
  border: 1px solid var(--bdr);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: rgba(82,255,143,.03);
}
.story-img-wrap::before {
  content: attr(data-label);
  font-family: var(--px);
  font-size: 9px;
  color: rgba(82,255,143,.18);
  letter-spacing: .08em;
  text-align: center;
  padding: 14px;
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.story-img-wrap img {
  position: relative;
  width: 100%;
  height: 100%;
  object-fit: contain;
  image-rendering: pixelated;
  z-index: 1;
  transition: opacity .35s ease;
}
.story-img-wrap img.fade {
  opacity: 0;
}
.story-cap {
  font-family: var(--vt);
  font-size: clamp(20px, 2vw, 26px);
  color: var(--grn);
  max-width: 780px;
  line-height: 1.3;
  text-shadow: 0 0 18px rgba(82,255,143,.4);
}
/* Farsi styling for story caption */
#game.lang-fa .story-cap {
  font-family: var(--fa);
  font-size: clamp(22px, 2.2vw, 30px);
  direction: rtl;
  line-height: 1.6;
}
.story-fa {
  /* No longer used - keeping for backwards compatibility */
  display: none;
  margin-top: -4px;
}
.story-cinematic .story-progress {
  position: static;
  transform: none;
  display: flex;
  gap: 8px;
  margin-top: 6px;
}
.story-cinematic .story-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: rgba(82,255,143,.18);
  transition: background .3s, transform .3s;
}
.story-cinematic .story-dot.active {
  background: var(--grn);
  transform: scale(1.35);
}
.story-cinematic .btn {
  margin-top: 10px;
}
.story-skip {
  position: absolute;
  top: 14px;
  left: 14px;
  z-index: 60;
  font-family: var(--px);
  font-size: 7px;
  background: transparent;
  color: rgba(180,255,210,.4);
  border: 1px solid rgba(180,255,210,.2);
  padding: 6px 9px;
  cursor: pointer;
}
.story-skip:hover {
  color: var(--grn);
  border-color: var(--grn);
}

/* PDB Mode visibility toggle */
.story-container.pdb-mode {
  display: none;
}
.story-container.pdb-mode.active {
  display: block;
}
#story-nav-pdb {
  display: none;
}
.story-container.pdb-mode.active + #story-nav-pdb {
  display: flex;
}

// ════════════════════════════════════════════════════════════════════════════

  const themes = {

  const variations = {

    rise:{seq:[0,0,3,7,3,7,10,12], lengths:[1,1,1,1,1,1,1,1], shift:0},
    sync:{seq:[0,0,3,7,0,3,5,7], lengths:[0.75,1.25,0.75,1.25,0.75,1.25,0.75,1.25], shift:0.12},
    arc:{seq:[0,3,7,3,0,3,7,10], lengths:[1,1,1,1,1,1,1,1], shift:0},
    shadow:{seq:[0,10,7,3,0,10,7,3], lengths:[1,1,1,1,1,1,1,1], shift:0}
  };
  const voices = {
    hybrid:{type:'custom', detune:0, overlay:'triangle', cutoff:1.0},
    square:{type:'square', detune:0, overlay:'triangle', cutoff:1.1},
    triangle:{type:'triangle', detune:0, overlay:'sine', cutoff:0.8},
    soft:{type:'sine', detune:0, overlay:'sine', cutoff:0.7},
    pulse:{type:'square', detune:-8, overlay:'square', cutoff:1.0},
    reed:{type:'custom2', detune:2, overlay:'sine', cutoff:0.95},

  };
  const presets = {
    menu:{theme:'title', variation:'arc', voice:'hybrid', leadOct:0, counterOct:12, arpOct:12, tempo:90, brightness:1700, layers:{counter:true, arp:true, drone:true, pulse:false, tension:false, doubleLead:false}, mix:{lead:0.64,bass:0.34,harmony:0.26,counter:0.2,arp:0.16,drone:0.15,pulse:0.0}},
    explore:{theme:'title', variation:'base', voice:'hybrid', leadOct:0, counterOct:12, arpOct:12, tempo:94, brightness:1750, layers:{counter:true, arp:true, drone:true, pulse:false, tension:false, doubleLead:false}, mix:{lead:0.62,bass:0.36,harmony:0.24,counter:0.18,arp:0.18,drone:0.16,pulse:0.0}},
    danger:{theme:'march', variation:'sync', voice:'pulse', leadOct:12, counterOct:0, arpOct:12, tempo:118, brightness:2400, layers:{counter:false, arp:true, drone:true, pulse:true, tension:true, doubleLead:true}, mix:{lead:0.72,bass:0.48,harmony:0.22,counter:0.0,arp:0.22,drone:0.12,pulse:0.18}},
    boss:{theme:'resolve', variation:'rise', voice:'square', leadOct:12, counterOct:12, arpOct:24, tempo:126, brightness:2600, layers:{counter:true, arp:true, drone:true, pulse:true, tension:true, doubleLead:true}, mix:{lead:0.74,bass:0.5,harmony:0.32,counter:0.24,arp:0.24,drone:0.12,pulse:0.2}},
    pause:{theme:'title', variation:'shadow', voice:'soft', leadOct:0, counterOct:12, arpOct:12, tempo:82, brightness:1500, layers:{counter:true, arp:true, drone:true, pulse:false, tension:false, doubleLead:false}, mix:{lead:0.48,bass:0.28,harmony:0.2,counter:0.14,arp:0.12,drone:0.18,pulse:0.0}},
    victory:{theme:'title', variation:'answer', voice:'hybrid', leadOct:0, counterOct:12, arpOct:12, tempo:96, brightness:1800, layers:{counter:true, arp:true, drone:true, pulse:false, tension:false, doubleLead:false}, mix:{lead:0.68,bass:0.38,harmony:0.28,counter:0.22,arp:0.2,drone:0.14,pulse:0.0}}
  };

  const state = { current:{...presets.menu}, ctx:null, master:null, analyser:null, filter:null, buses:{}, running:false, started:false, timers:{main:null,arp:null,drone:null,pulse:null,mod:null}, step:0, hybridWave:null, reedWave:null };

  const midiToFreq = m => 440 * Math.pow(2,(m-69)/12);
  const currentTheme = () => themes[state.current.theme];
  const currentVariation = () => variations[state.current.variation];
  const currentVoice = () => voices[state.current.voice];

  function noiseBuffer(ctx){ const b=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.4; return b; }
  function makeOsc(freq, kind, time){ const osc=state.ctx.createOscillator(); if(kind==='custom') osc.setPeriodicWave(state.hybridWave); else if(kind==='custom2') osc.setPeriodicWave(state.reedWave); else osc.type=kind; osc.frequency.setValueAtTime(freq,time); return osc; }
  function playVoice(freq,time,len,kind,bus,gainAmt,detune=0,attack=0.012){ const osc=makeOsc(freq,kind,time), gain=state.ctx.createGain(); osc.detune.setValueAtTime(detune,time); gain.gain.setValueAtTime(.0001,time); gain.gain.linearRampToValueAtTime(gainAmt,time+attack); gain.gain.exponentialRampToValueAtTime(.0001,time+len); osc.connect(gain).connect(state.buses[bus]); osc.start(time); osc.stop(time+len+.05); }
  function playHarmony(chord,time,beatLen,root){ chord.forEach((semi,i)=>{ const freq=midiToFreq(root+semi+(i===0?0:12)); playVoice(freq,time,beatLen*1.8,i===0?'triangle':'sine','harmony',0.022+i*0.007,0,0.03); }); }
  function playNoiseAccent(time,len,amount){ const src=state.ctx.createBufferSource(), hp=state.ctx.createBiquadFilter(), gain=state.ctx.createGain(); src.buffer=noiseBuffer(state.ctx); hp.type='highpass'; hp.frequency.setValueAtTime(1200 + amount * 1600, time); gain.gain.setValueAtTime(.0001,time); gain.gain.linearRampToValueAtTime(.008 + amount * .03,time+.02); gain.gain.exponentialRampToValueAtTime(.0001,time+len); src.connect(hp).connect(gain).connect(state.buses.tension); src.start(time); src.stop(time+len+.03); }

  function syncMix(){
    if(!state.ctx) return;
    const now = state.ctx.currentTime;
    state.master.gain.setTargetAtTime(0.84, now, .2);
    state.filter.frequency.setTargetAtTime(state.current.brightness * currentVoice().cutoff, now, .25);
    state.buses.lead.gain.setTargetAtTime(state.current.mix.lead, now, .25);
    state.buses.bass.gain.setTargetAtTime(state.current.mix.bass, now, .25);
    state.buses.harmony.gain.setTargetAtTime(state.current.mix.harmony, now, .25);
    state.buses.counter.gain.setTargetAtTime(state.current.layers.counter ? state.current.mix.counter : .0001, now, .25);
    state.buses.arp.gain.setTargetAtTime(state.current.layers.arp ? state.current.mix.arp : .0001, now, .25);
    state.buses.drone.gain.setTargetAtTime(state.current.layers.drone ? state.current.mix.drone : .0001, now, .25);
    state.buses.pulse.gain.setTargetAtTime(state.current.layers.pulse ? state.current.mix.pulse : .0001, now, .25);
    state.buses.tension.gain.setTargetAtTime(state.current.layers.tension ? .22 : .0001, now, .25);
  }

  function mainLoop(){
    if(!state.running || !state.ctx) return;
    const theme=currentTheme(), variation=currentVariation(), voice=currentVoice();
    const beat=60/state.current.tempo, idx=state.step%8, phrase=Math.floor(state.step/8)%4, root=theme.rootMidi+theme.progression[phrase], now=state.ctx.currentTime;
    const bassSemi=theme.bass[idx];
    playVoice(midiToFreq(theme.rootMidi-12+bassSemi), now, beat*0.74, 'triangle', 'bass', 0.055, 0, 0.01);
    if(idx%2===0) playVoice(midiToFreq(theme.rootMidi-24+bassSemi), now, beat*0.44, 'triangle', 'bass', 0.028, 0, 0.01);
    const motifSemi=variation.seq[idx], motifLen=beat*(0.58*variation.lengths[idx]);
    playVoice(midiToFreq(root+motifSemi+state.current.leadOct), now+beat*variation.shift, motifLen, voice.type, 'lead', 0.09, voice.detune, voice.type==='string'?0.05:0.012);
    playVoice(midiToFreq(root+motifSemi+12+state.current.leadOct), now+beat*variation.shift+0.02, motifLen*0.5, voice.overlay, 'lead', 0.028, 3, 0.02);
    if(state.current.layers.doubleLead) playVoice(midiToFreq(root+motifSemi+12+state.current.leadOct), now+beat*variation.shift, motifLen*0.92, voice.type, 'lead', 0.032, voice.detune, 0.02);
    if(idx===0||idx===4) playHarmony(theme.harmony[phrase], now, beat, root);
    if(state.current.layers.counter && (idx===2||idx===6)){ const csemi=theme.counter[idx]; playVoice(midiToFreq(root+csemi+state.current.counterOct), now+beat*0.18, beat*0.62, voice.type==='soft'?'triangle':'sine', 'counter', 0.04, 0, 0.03); }
    if(state.current.layers.tension && (idx===3||idx===7)){ const semi=theme.tension[Math.floor(Math.random()*theme.tension.length)]; playVoice(midiToFreq(theme.rootMidi+semi), now+beat*0.12, beat*0.46, 'square', 'tension', 0.026, 0, 0.01); playNoiseAccent(now+beat*0.1, beat*0.42, 0.3); }
    state.step += 1;
    state.timers.main = setTimeout(mainLoop, beat * 1000);
  }
  function arpLoop(){ if(!state.running || !state.ctx) return; const theme=currentTheme(), beat=60/state.current.tempo, phrase=Math.floor(state.step/8)%4, root=theme.rootMidi+theme.progression[phrase]; if(state.current.layers.arp){ const notes=theme.harmony[phrase]; const pick=notes[(state.step+1)%notes.length]; playVoice(midiToFreq(root+pick+state.current.arpOct), state.ctx.currentTime, beat*0.32, 'triangle', 'arp', 0.03, 0, 0.005);} state.timers.arp=setTimeout(arpLoop,(beat/2)*1000); }
  function droneLoop(){ if(!state.running || !state.ctx) return; const theme=currentTheme(), beat=60/state.current.tempo, phrase=Math.floor(state.step/8)%4, root=theme.rootMidi+theme.progression[phrase]; if(state.current.layers.drone){ playVoice(midiToFreq(root-12), state.ctx.currentTime, beat*3.7, 'sine', 'drone', 0.026, 0, 0.04); playVoice(midiToFreq(root-5), state.ctx.currentTime, beat*3.7, 'triangle', 'drone', 0.014, 0, 0.04);} state.timers.drone=setTimeout(droneLoop, beat*4000); }
  function pulseLoop(){ if(!state.running || !state.ctx) return; const beat=60/state.current.tempo; if(state.current.layers.pulse){ playVoice(midiToFreq(currentTheme().rootMidi-24), state.ctx.currentTime, beat*0.12, 'square', 'pulse', 0.024, 0, 0.002);} state.timers.pulse=setTimeout(pulseLoop, beat*500); }
  function modLoop(){ if(!state.running || !state.ctx) return; const now=state.ctx.currentTime; state.filter.frequency.linearRampToValueAtTime(state.current.brightness * currentVoice().cutoff, now+.25); state.timers.mod=setTimeout(modLoop,220); }

  async function init(){
    if(state.started) return api;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const master = ctx.createGain(), analyser = ctx.createAnalyser(), filter = ctx.createBiquadFilter();
    filter.type='lowpass'; filter.frequency.value=state.current.brightness; filter.Q.value=.8; analyser.fftSize=1024; master.gain.value=.84;
    const real1=new Float32Array([0,1,0.6,0.35,0.18]), imag1=new Float32Array(real1.length), hybridWave=ctx.createPeriodicWave(real1, imag1);
    const real2=new Float32Array([0,1,0.25,0.5,0.08,0.12]), imag2=new Float32Array(real2.length), reedWave=ctx.createPeriodicWave(real2, imag2);
    const buses={}; ['lead','bass','harmony','counter','arp','drone','pulse','tension'].forEach(id=>{ const bus=ctx.createGain(); bus.gain.value=.1; bus.connect(filter); buses[id]=bus; });
    filter.connect(master); master.connect(analyser); analyser.connect(ctx.destination);
    Object.assign(state,{ctx,master,analyser,filter,buses,hybridWave,reedWave,started:true});
    syncMix();
    return api;
  }
  async function start(){ if(!state.started) await init(); await state.ctx.resume(); state.running=true; Object.keys(state.timers).forEach(k=>clearTimeout(state.timers[k])); mainLoop(); arpLoop(); droneLoop(); pulseLoop(); modLoop(); return api; }
  function pause(){ state.running=false; Object.keys(state.timers).forEach(k=>clearTimeout(state.timers[k])); if(state.ctx?.state==='running') state.ctx.suspend(); return api; }
  async function resume(){ if(!state.started) await init(); await state.ctx.resume(); if(!state.running){ state.running=true; mainLoop(); arpLoop(); droneLoop(); pulseLoop(); modLoop(); } return api; }
  function setParams(partial={}){
    state.current = {
      ...state.current,
      ...partial,
      mix:{...state.current.mix, ...(partial.mix||{})},
      layers:{...state.current.layers, ...(partial.layers||{})}
    };
    syncMix();
    return api;
  }
  function applyState(name){ if(presets[name]) setParams(presets[name]); return api; }
  function getState(){ return structuredClone ? structuredClone(state.current) : JSON.parse(JSON.stringify(state.current)); }
  function isRunning(){ return state.running; }
  function setVolume(vol){ if(state.master) state.master.gain.setTargetAtTime(vol * 0.84, state.ctx.currentTime, 0.1); return api; }
  const api = { init, start, pause, resume, setParams, applyState, getState, isRunning, setVolume, getAnalyser:()=>state.analyser };
  return api;
}

// Chiptune SFX Engine - procedural 8-bit sound effects
function createChiptuneSFX(audioCtx, destNode) {
  const ctx = audioCtx;
  const dest = destNode || ctx.destination;
  
  function playTone(freq, duration, type, volume, detune = 0, attack = 0.01, decay = 0.1) {
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const now = ctx.currentTime;
    
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    osc.detune.setValueAtTime(detune, now);
    
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(volume, now + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    
    osc.connect(gain);
    gain.connect(dest);
    osc.start(now);
    osc.stop(now + duration + 0.05);
  }
  
  function playNoise(duration, volume, highpass = 800) {
    if (!ctx) return;
    const bufferSize = ctx.sampleRate * duration;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.5;
    }
    
    const source = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    const now = ctx.currentTime;
    
    source.buffer = buffer;
    filter.type = 'highpass';
    filter.frequency.setValueAtTime(highpass, now);
    
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    
    source.connect(filter);
    filter.connect(gain);
    gain.connect(dest);
    source.start(now);
    source.stop(now + duration + 0.05);
  }
  
  return {
    hover() {
      // Soft bell-like ping
      playTone(1200, 0.08, 'sine', 0.04, 0, 0.005, 0.04);
    },
    
    click() {
      // Gentle two-tone confirmation
      playTone(600, 0.1, 'sine', 0.06, 0, 0.008, 0.05);
      playTone(800, 0.08, 'sine', 0.05, 0, 0.015, 0.04);
    },
    
    cardSelect() {
      // Soft rising chime
      playTone(523, 0.15, 'sine', 0.06, 0, 0.02, 0.08);
      setTimeout(() => playTone(659, 0.12, 'sine', 0.05, 0, 0.02, 0.06), 50);
      setTimeout(() => playTone(784, 0.1, 'sine', 0.04, 0, 0.02, 0.05), 100);
    },
    
    cardFlip() {
      // Gentle whoosh with soft reveal tone
      playTone(200, 0.12, 'sine', 0.04, 50, 0.01, 0.06);
      setTimeout(() => {
        playTone(440, 0.2, 'sine', 0.07, 0, 0.03, 0.12);
        playTone(554, 0.15, 'triangle', 0.04, 0, 0.04, 0.08);
      }, 60);
    },
    
    meterUp() {
      // Gentle ascending tone
      playTone(440, 0.12, 'sine', 0.05, 0, 0.02, 0.06);
      setTimeout(() => playTone(554, 0.1, 'sine', 0.04, 0, 0.02, 0.05), 70);
    },
    
    meterDown() {
      // Soft descending tone
      playTone(392, 0.12, 'triangle', 0.05, 0, 0.02, 0.06);
      setTimeout(() => playTone(330, 0.1, 'triangle', 0.04, 0, 0.02, 0.05), 70);
    },
    
    wildcard() {
      // Mysterious gentle arpeggio
      const notes = [392, 494, 587, 784];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          playTone(freq, 0.2, 'sine', 0.06 - i * 0.008, 0, 0.03, 0.12);
        }, i * 100);
      });
    },
    
    victory() {
      // Triumphant fanfare - rising major chord arpeggio with sustain
      const melody = [523, 659, 784, 1047, 1319];
      melody.forEach((freq, i) => {
        setTimeout(() => {
          playTone(freq, 0.35, 'sine', 0.1, 0, 0.02, 0.2);
          playTone(freq * 0.5, 0.3, 'triangle', 0.05, 0, 0.03, 0.15);
        }, i * 120);
      });
      // Final triumphant chord
      setTimeout(() => {
        playTone(1047, 0.8, 'sine', 0.12, 0, 0.05, 0.4);
        playTone(784, 0.7, 'sine', 0.08, 0, 0.06, 0.35);
        playTone(523, 0.75, 'triangle', 0.06, 0, 0.07, 0.4);
      }, 650);
    },
    
    defeat() {
      // Somber descending minor progression
      const notes = [440, 392, 330, 294, 220];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          playTone(freq, 0.4, 'triangle', 0.07 - i * 0.008, -3, 0.04, 0.25);
        }, i * 200);
      });
      // Final low tone
      setTimeout(() => {
        playTone(165, 0.9, 'sine', 0.06, 0, 0.08, 0.5);
        playTone(220, 0.7, 'triangle', 0.04, 0, 0.1, 0.4);
      }, 1000);
    },
    
    transition() {
      // Soft sweep
      playTone(300, 0.15, 'sine', 0.04, 30, 0.02, 0.08);
      setTimeout(() => playTone(400, 0.12, 'sine', 0.03, 0, 0.02, 0.06), 80);
    },
    
    flagActivate() {
      // Gentle notification chime
      playTone(659, 0.12, 'sine', 0.05, 0, 0.02, 0.06);
      setTimeout(() => playTone(784, 0.15, 'sine', 0.06, 0, 0.025, 0.08), 60);
    },
    
    storyAdvance() {
      // Soft page turn sound
      playTone(700, 0.06, 'sine', 0.04, 0, 0.01, 0.03);
    }
  };
}

// Audio Manager - unified control for music and SFX
const audioManager = {
  musicEnabled: false,
  sfxEnabled: false,
  musicVolume: 0.3,
  sfxVolume: 0.3,
  initialized: false,
  ctx: null,
  music: null,
  sfx: null,
  sfxGain: null,
  previousMusicState: null,
  
  async init() {
    if (this.initialized) return;
    
    // Load preferences from localStorage
    const savedMusic = localStorage.getItem('audio_music');
    const savedSfx = localStorage.getItem('audio_sfx');
    const savedMusicVol = localStorage.getItem('audio_music_volume');
    const savedSfxVol = localStorage.getItem('audio_sfx_volume');
    if (savedMusic !== null) this.musicEnabled = savedMusic === 'true';
    if (savedSfx !== null) this.sfxEnabled = savedSfx === 'true';
    if (savedMusicVol !== null) this.musicVolume = parseFloat(savedMusicVol);
    if (savedSfxVol !== null) this.sfxVolume = parseFloat(savedSfxVol);
    
    // Create AudioContext
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Create SFX gain node
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = this.sfxVolume;
    this.sfxGain.connect(this.ctx.destination);
    
    // Initialize engines
    this.music = createGameMusicEngine();
    await this.music.init();
    this.sfx = createChiptuneSFX(this.ctx, this.sfxGain);
    
    // Apply saved volumes
    this.applyMusicVolume();
    
    this.initialized = true;
    this.syncToggleUI();
    this.syncVolumeUI();
    
    // Start music if enabled
    if (this.musicEnabled) {
      await this.music.start();
    }
  },
  
  setMusic(enabled) {
    this.musicEnabled = enabled;
    localStorage.setItem('audio_music', enabled);
    
    if (this.music) {
      if (enabled) {
        this.music.resume();
      } else {
        this.music.pause();
      }
    }
    this.syncToggleUI();
  },
  
  setSFX(enabled) {
    this.sfxEnabled = enabled;
    localStorage.setItem('audio_sfx', enabled);
    this.syncToggleUI();
  },
  
  toggleMusic() {
    this.setMusic(!this.musicEnabled);
  },
  
  toggleSFX() {
    this.setSFX(!this.sfxEnabled);
  },
  
  setMusicVolume(volume) {
    this.musicVolume = Math.max(0, Math.min(1, volume));
    localStorage.setItem('audio_music_volume', this.musicVolume);
    this.applyMusicVolume();
  },
  
  setSFXVolume(volume) {
    this.sfxVolume = Math.max(0, Math.min(1, volume));
    localStorage.setItem('audio_sfx_volume', this.sfxVolume);
    if (this.sfxGain) {
      this.sfxGain.gain.setValueAtTime(this.sfxVolume, this.ctx.currentTime);
    }
  },
  
  applyMusicVolume() {
    if (this.music && this.music.setVolume) {
      this.music.setVolume(this.musicVolume);
    }
  },
  
  syncVolumeUI() {
    const musicSlider = document.getElementById('volume-music');
    const sfxSlider = document.getElementById('volume-sfx');
    if (musicSlider) musicSlider.value = this.musicVolume * 100;
    if (sfxSlider) sfxSlider.value = this.sfxVolume * 100;
  },
  
  applyMusicState(stateName) {
    if (this.music && this.musicEnabled) {
      this.music.applyState(stateName);
    }
  },
  
  setMusicParams(params) {
    if (this.music && this.musicEnabled) {
      this.music.setParams(params);
    }
  },
  
  saveMusicState() {
    if (this.music) {
      this.previousMusicState = this.music.getState();
    }
  },
  
  restoreMusicState() {
    if (this.music && this.previousMusicState) {
      this.music.setParams(this.previousMusicState);
      this.previousMusicState = null;
    }
  },
  
  playSFX(name) {
    if (!this.sfxEnabled || !this.sfx || !this.sfx[name]) return;
    try {
      // Resume context if suspended (autoplay policy)
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      this.sfx[name]();
    } catch (e) {
      console.warn('SFX playback failed:', name, e);
    }
  },
  
  syncToggleUI() {
    // Update global audio toggles
    const musicGlobal = document.getElementById('audio-toggle-music-global');
    const sfxGlobal = document.getElementById('audio-toggle-sfx-global');
    
    if (musicGlobal) {
      musicGlobal.classList.toggle('active', this.musicEnabled);
      musicGlobal.classList.toggle('off', !this.musicEnabled);
    }
    if (sfxGlobal) {
      sfxGlobal.classList.toggle('active', this.sfxEnabled);
      sfxGlobal.classList.toggle('off', !this.sfxEnabled);
    }
  },
  
  updateMusicFromGameState(gameState) {
    if (!this.music || !this.musicEnabled) return;
    
    // Get player's meters based on which side they're playing
    let playerMeters;
    if (gameState.playerSide === 'trump') {
      playerMeters = [gameState.bars.trump.lev, gameState.bars.trump.pol, gameState.bars.trump.all];
    } else {
      playerMeters = [gameState.bars.irgc.grip, gameState.bars.irgc.chest, gameState.bars.irgc.proxy];
    }
    
    // Calculate average health
    const avgHealth = playerMeters.reduce((a, b) => a + b, 0) / 3;
    
    // Find minimum meter (most critical)
    const minMeter = Math.min(...playerMeters);
    
    // Adjust music based on player health
    if (minMeter < 20 || avgHealth < 25) {
      // Critical danger - intense music
      this.music.setParams({ 
        tempo: 122,
        brightness: 2500,
        layers: { tension: true, doubleLead: true, pulse: true }
      });
    } else if (avgHealth < 40) {
      // Danger zone - increased tension
      this.music.setParams({ 
        tempo: 112,
        brightness: 2200,
        layers: { tension: true, pulse: true }
      });
    } else if (avgHealth > 70 && minMeter > 50) {
      // Comfortable position - relaxed music
      this.music.setParams({ 
        tempo: 98,
        brightness: 1800,
        layers: { tension: false, doubleLead: false }
      });
    } else {
      // Normal gameplay - standard explore settings
      this.music.setParams({ 
        tempo: 102,
        brightness: 1900,
        layers: { tension: false }
      });
    }
  }
};

  if (typeof obj === 'string') return obj;
  if (!obj) return '';
  return obj[currentLang] || obj.en || '';

const START_DATE = new Date(2026, 2, 1); // March 1, 2026 (month is 0-indexed)

function getGameDate(dayNumber) {
  const date = new Date(START_DATE);
  date.setDate(date.getDate() + dayNumber - 1);
  return `${t(MONTHS[date.getMonth()])} ${date.getDate()}, ${date.getFullYear()}`;
}

function getStoryUpdate(dayNumber) {
  const index = Math.min(dayNumber - 1, STORY_UPDATES.length - 1);
  return t(STORY_UPDATES[index]);
}

const game = {
  playerSide: null,
  day: 1,
  phase: 'select', // select, reveal, wildcard, consequences, next
  bars: {
    trump: { lev: 30, pol: 60, all: 50 },
    irgc: { grip: 45, chest: 50, proxy: 50 }
  },
  cooldowns: { trump: {}, irgc: {} },
  flags: {
    CARRIER_GROUP: false,
    BLOCKADE: false,
    INTERNET_SHUTDOWN: true, // starts active
    STARLINK: false,
    IRAQI_PMF: false,
    FATEMIYOUN: false,
    PROTESTS: false,
    STRIKE: false,
    BASIJ_DEFECT: false,
    airstrikeUsed: false
  },
  selectedCard: null,
  aiCard: null,
  trumpCard: null,
  irgcCard: null,
  currentWildcard: null,

  reset() {
    this.playerSide = null;
    this.day = 1;
    this.phase = 'select';
    this.bars = {
      trump: { lev: 30, pol: 60, all: 50 },
      irgc: { grip: 45, chest: 50, proxy: 50 }
    };
    this.cooldowns = { trump: {}, irgc: {} };
    this.flags = {
      CARRIER_GROUP: false, BLOCKADE: false, INTERNET_SHUTDOWN: true,
      STARLINK: false, IRAQI_PMF: false, FATEMIYOUN: false,
      PROTESTS: false, STRIKE: false, BASIJ_DEFECT: false, airstrikeUsed: false
    };
    this.selectedCard = null;
    this.aiCard = null;
    this.trumpCard = null;
    this.irgcCard = null;
    this.currentWildcard = null;
  },

  getPlayerCards() { return this.playerSide === 'trump' ? TRUMP_CARDS : IRGC_CARDS; },
  getAICards() { return this.playerSide === 'trump' ? IRGC_CARDS : TRUMP_CARDS; },
  getAISide() { return this.playerSide === 'trump' ? 'irgc' : 'trump'; },

  isCardAvailable(card, side) {
    if (this.cooldowns[side][card.id] > 0) return false;
    return this.checkGate(card, side);
  },

  checkGate(card, side) {
    if (!card.gate) return true;
    const bars = this.bars[side];
    if (card.gate.special === 'airstrikeUsed' && !this.flags.airstrikeUsed) return false;
    if (card.gate.bar && bars[card.gate.bar] < card.gate.min) return false;
    if (card.gate.bar2 && bars[card.gate.bar2] < card.gate.min2) return false;
    return true;
  },

  applyCard(card, side) {
    // Check if card is blocked by an active flag (e.g., SELL OIL blocked by BLOCKADE)
    const isBlocked = card.blockedBy && this.flags[card.blockedBy];
    
    for (const bar of ['lev', 'pol', 'all']) {
      this.bars.trump[bar] = Math.max(0, Math.min(100, this.bars.trump[bar] + card.effects[bar]));
    }
    for (const bar of ['grip', 'chest', 'proxy']) {
      let effect = card.effects[bar];
      // If blocked, neutralize chest gains (but not losses)
      if (isBlocked && bar === 'chest' && effect > 0) {
        effect = 0;
      }
      this.bars.irgc[bar] = Math.max(0, Math.min(100, this.bars.irgc[bar] + effect));
    }
    this.cooldowns[side][card.id] = 2;
    if (card.setsFlag) this.flags[card.setsFlag] = true;
  },

  decrementCooldowns() {
    for (const side of ['trump', 'irgc']) {
      for (const id in this.cooldowns[side]) {
        if (this.cooldowns[side][id] > 0) this.cooldowns[side][id]--;
      }
    }
  },

  applyFlagEffects() {
    // Apply per-turn effects from all active flags
    for (const flagKey in FLAG_DATA) {
      if (!this.flags[flagKey]) continue;
      const flagData = FLAG_DATA[flagKey];
      if (!flagData.perTurn) continue;
      
      // Check for internet shutdown reducing protest/starlink effects
      const internetUp = this.flags.STARLINK || !this.flags.INTERNET_SHUTDOWN;
      
      for (const bar in flagData.perTurn) {
        let effect = flagData.perTurn[bar];
        
        // Internet shutdown halves negative grip effects from protests (unless Starlink active)
        if (bar === 'grip' && effect < 0 && !internetUp && 
            (flagKey === 'PROTESTS' || flagKey === 'BASIJ_DEFECT')) {
          effect = Math.ceil(effect / 2);
        }
        
        // Apply to correct side
        if (['lev', 'pol', 'all'].includes(bar)) {
          this.bars.trump[bar] = Math.max(0, Math.min(100, this.bars.trump[bar] + effect));
        } else {
          this.bars.irgc[bar] = Math.max(0, Math.min(100, this.bars.irgc[bar] + effect));
        }
      }
    }
  },

  checkWin() {
    const { trump, irgc } = this.bars;
    if (irgc.grip <= 0) return 'trump_grip';
    if (irgc.chest <= 0) return 'trump_chest';
    if (irgc.proxy <= 0) return 'trump_proxy';
    if (trump.lev <= 0) return 'irgc_lev';
    if (trump.pol <= 0) return 'irgc_pol';
    if (trump.all <= 0) return 'irgc_all';
    if (this.day >= 13) return 'stalemate';
    return null;
  }
};

function pickAICard() {
  const aiSide = game.getAISide();
  const cards = game.getAICards();
  const available = cards.filter(c => game.isCardAvailable(c, aiSide));
  if (available.length === 0) return cards[0];
  return available[Math.floor(Math.random() * available.length)];
}

function showScreen(id, useWipe = false) {
  const langToggle = document.getElementById('lang-toggle');
  
  if (useWipe) {
    audioManager.playSFX('transition');
    const wipe = document.getElementById('screen-wipe');
    wipe.classList.add('active');
    setTimeout(() => {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      langToggle.classList.toggle('centered', id === 'screen-title');
    }, 200);
    setTimeout(() => {
      wipe.classList.remove('active');
    }, 450);
  } else {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    langToggle.classList.toggle('centered', id === 'screen-title');
  }
}

// Typewriter effect
let typewriterTimeout = null;
function typewriterEffect(element, text, speed = 8, callback) {
  if (typewriterTimeout) clearTimeout(typewriterTimeout);
  element.textContent = '';
  element.classList.add('typing');
  let i = 0;
  
  function type() {
    if (i < text.length) {
      element.textContent += text.charAt(i);
      i++;
      typewriterTimeout = setTimeout(type, speed);
    } else {
      element.classList.remove('typing');
      if (callback) callback();
    }
  }
  type();
}

// Quick typewriter for story updates
function updateStoryWithTypewriter(text) {
  const el = document.getElementById('board-story-text');
  typewriterEffect(el, text, 6);
}

function startIntroStory(callback) {
  storyState.mode = 'intro';
  storyState.pages = INTRO_STORY;
  storyState.currentPage = 0;
  storyState.afterCallback = callback;
  showStoryPage();
  showScreen('screen-story', true);
}

function startInterlude(day, callback) {
  const interlude = INTERLUDE_STORIES[day];
  if (!interlude) {
    if (callback) callback();
    return;
  }
  storyState.mode = 'interlude';
  storyState.pages = [interlude];
  storyState.currentPage = 0;
  storyState.afterCallback = () => {
    audioManager.applyMusicState('explore');
    if (callback) callback();
  };
  audioManager.applyMusicState('pause');
  showStoryPage();
  showScreen('screen-story', true);
}

function showStoryPage() {
  const page = storyState.pages[storyState.currentPage];
  const isCinematic = page.type === 'story';
  
  // Toggle visibility between cinematic and PDB modes
  const cinematicEl = document.getElementById('story-cinematic');
  const pdbEl = document.getElementById('story-pdb');
  const pdbNav = document.getElementById('story-nav-pdb');
  
  cinematicEl.classList.toggle('active', isCinematic);
  pdbEl.classList.toggle('active', !isCinematic);
  
  if (isCinematic) {
    // Render cinematic story mode - uses en/fa directly for both languages
    const imgWrap = document.getElementById('story-img-wrap');
    const img = document.getElementById('story-img');
    const cap = document.getElementById('story-cap');
    const fa = document.getElementById('story-fa');
    
    imgWrap.setAttribute('data-label', page.label || '[ STORY PANEL ]');
    
    // Fade image transition
    img.classList.add('fade');
    setTimeout(() => {
      img.src = page.img || '';
      img.style.display = page.img ? '' : 'none';
      img.classList.remove('fade');
      // Show only the selected language
      const storyText = page.en ? t({ en: page.en, fa: page.fa }) : (page.text ? t(page.text) : '');
      cap.textContent = storyText;
      fa.textContent = ''; // No longer showing both languages
    }, 200);
    
    // Update progress dots for cinematic mode
    updateStoryProgress('story-progress-cinematic');
    
    // Update button text using UI strings
    const btn = document.getElementById('btn-story-next-cinematic');
    if (storyState.currentPage >= storyState.pages.length - 1) {
      btn.textContent = storyState.mode === 'intro' ? t(UI.selectYourSide) : t(UI.continue);
    } else {
      btn.textContent = t(UI.continue);
    }
  } else {
    // Render PDB dossier mode - use t() for bilingual content
    document.getElementById('story-date').textContent = `DATE: ${t(page.date)}`;
    document.getElementById('story-headline').textContent = `SUBJECT: ${t(page.headline)}`;
    
    // Display text immediately (no typewriter on centered/dossier text)
    const textEl = document.getElementById('story-text');
    textEl.innerHTML = t(page.text);
    
    // Update page counter
    const pageNum = storyState.currentPage + 1;
    const totalPages = storyState.pages.length;
    document.getElementById('pdb-page').textContent = `PAGE ${pageNum} OF ${totalPages}`;
    
    // Handle quote/intel source
    const quoteContainer = document.getElementById('story-quote');
    if (page.quote) {
      quoteContainer.style.display = 'block';
      document.getElementById('story-quote-text').textContent = `"${t(page.quote)}"`;
      // Format speaker as intel source
      const speaker = t(page.speaker) ? t(page.speaker).replace('— ', '') : '';
      document.getElementById('story-speaker').textContent = speaker ? `SOURCE: ${speaker.toUpperCase()}` : '';
    } else {
      quoteContainer.style.display = 'none';
    }
    
    // Update progress dots for PDB mode
    updateStoryProgress('story-progress-pdb');
    
    // Update button text using UI strings
    const btn = document.getElementById('btn-story-next');
    if (storyState.currentPage >= storyState.pages.length - 1) {
      btn.textContent = storyState.mode === 'intro' ? t(UI.chooseSide) + ' ▶' : t(UI.continueRight);
    } else {
      btn.textContent = t(UI.continueRight);
    }
  }
}

function typewriterHTML(element, html, speed) {
  // Strip tags for typewriter, then restore
  const temp = document.createElement('div');
  temp.innerHTML = html;
  const plainText = temp.textContent;
  
  element.textContent = '';
  element.classList.add('typing');
  let i = 0;
  
  function type() {
    if (i < plainText.length) {
      element.textContent += plainText.charAt(i);
      i++;
      typewriterTimeout = setTimeout(type, speed);
    } else {
      element.classList.remove('typing');
      // Restore HTML formatting after typewriter completes
      element.innerHTML = html;
    }
  }
  type();
}

function updateStoryProgress(containerId) {
  const container = document.getElementById(containerId || 'story-progress-cinematic');
  if (!container) return;
  container.innerHTML = '';
  
  for (let i = 0; i < storyState.pages.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'story-dot';
    if (i < storyState.currentPage) dot.classList.add('seen');
    if (i === storyState.currentPage) dot.classList.add('active');
    container.appendChild(dot);
  }
}

function advanceStory() {
  storyState.currentPage++;
  
  if (storyState.currentPage >= storyState.pages.length) {
    // Story complete
    if (storyState.afterCallback) {
      storyState.afterCallback();
    }
  } else {
    showStoryPage();
  }
}

function renderFlags() {
  const container = document.getElementById('flags-container');
  container.innerHTML = '';
  
  for (const flagKey in FLAG_DATA) {
    const data = FLAG_DATA[flagKey];
    const el = document.createElement('div');
    el.className = 'flag';
    el.dataset.flag = flagKey;
    if (game.flags[flagKey]) el.classList.add('active');
    
    // Build effects HTML using t() for bilingual text
    let effectsHtml = data.effects.map(e => 
      `<div class="ft-effect ${e.side}">${t(e.text)}</div>`
    ).join('');
    
    el.innerHTML = `
      <span class="icon">${FLAG_ICONS[flagKey]}</span>
      <span class="flag-label">${t(FLAG_LABELS[flagKey])}</span>
      <div class="flag-tooltip">

        <div class="ft-desc">${t(data.desc)}</div>
        <div class="ft-effects">${effectsHtml}</div>
      </div>

function updateFlags() {
  document.querySelectorAll('.flag').forEach(el => {
    const flag = el.dataset.flag;
    el.classList.toggle('active', !!game.flags[flag]);
  });
